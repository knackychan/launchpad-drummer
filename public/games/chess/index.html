<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launchpad Chess</title>
<style>
  :root { --bg:#07080c; --panel:#11141c; --line:#2a3040; --text:#e6dcc3; --dim:#8a8f9c; --orange:#ff5b1f; --amber:#ffb21a; --cyan:#41c8ff; --green:#3ddc84; --red:#ff3b3b; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"Segoe UI", system-ui, sans-serif; overflow:hidden; }
  #bar { height:44px; display:flex; align-items:center; gap:10px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line); font-size:12px; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; overflow-x:auto; overflow-y:hidden; }
  #bar .brand { color:var(--orange); font-weight:700; letter-spacing:.12em; }
  #bar label { color:var(--dim); display:flex; align-items:center; gap:6px; }
  #bar select, #bar button { background:#1a1f2b; color:var(--text); border:1px solid var(--line); border-radius:3px; padding:3px 6px; font:inherit; text-transform:uppercase; }
  #bar button:hover { border-color:var(--orange); cursor:pointer; }
  #midi { display:flex; align-items:center; gap:6px; }
  #midi .lamp { width:9px; height:9px; border-radius:50%; background:#444; box-shadow:0 0 0 1px #000 inset; }
  #midi .lamp.on { background:var(--green); box-shadow:0 0 6px var(--green); }
  #midi .lamp.warn { background:var(--amber); box-shadow:0 0 6px var(--amber); }
  #mirror { width:54px; height:54px; image-rendering:pixelated; border:1px solid var(--line); border-radius:3px; background:#000; margin-left:auto; }
  #stage { position:absolute; top:44px; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; gap:14px; background:radial-gradient(ellipse at center, #0c0f16 0%, #05060a 70%); }
  #wrap { position:relative; }
  canvas#screen { display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:#000; cursor:pointer; }
  .crt { position:absolute; inset:0; pointer-events:none; border-radius:6px; }
  .crt.scan { background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 3px); mix-blend-mode:multiply; }
  .crt.vig { box-shadow:inset 0 0 120px rgba(0,0,0,.65), inset 0 0 20px rgba(0,0,0,.6); }
  .crt.glow { box-shadow:0 0 40px rgba(255,140,60,.07); }
  #wrap.nocrt .crt { display:none; }
  #side { width:190px; align-self:stretch; margin:12px 12px 12px 0; background:var(--panel); border:1px solid var(--line); border-radius:4px; display:flex; flex-direction:column; font-size:12px; }
  #side h3 { margin:0; padding:8px 10px; font-size:11px; letter-spacing:.14em; color:var(--orange); border-bottom:1px solid var(--line); }
  #moves { flex:1; overflow-y:auto; padding:6px 10px; font-family:Consolas, "Cascadia Mono", monospace; line-height:1.6; }
  #moves .n { color:var(--dim); display:inline-block; width:28px; }
  #moves .m { display:inline-block; width:62px; }
  #moves .last { color:var(--amber); }
  #keys { padding:8px 10px; border-top:1px solid var(--line); color:var(--dim); line-height:1.55; font-size:11px; }
  #keys b { color:var(--text); font-weight:600; }
</style>
<link rel="stylesheet" href="../shared/launchband-menu.css">
<script src="../shared/launchband-menu.js"></script>
<script src="chess-rules.js"></script>
<script src="chess-ai.js"></script>
</head>
<body>
<div id="bar">
  <button id="openMenuBtn" style="border-color:var(--orange); color:#fff; font-weight:800; background:rgba(255,94,26,0.18); padding:3px 8px; border-radius:3px;">⚙️ MENU / SETUP</button>
  <span class="brand">LPD · CHESS</span>
  <label>Mode <select id="modeSel"><option value="ai-b" selected>vs AI (Play White)</option><option value="ai-w">vs AI (Play Black)</option><option value="pvp">2 Players</option><option value="ai-ai">AI vs AI</option></select></label>
  <label>AI Level <select id="aiLevelSel"><option value="1">L1 Easy</option><option value="2">L2 Relaxed</option><option value="3" selected>L3 Standard</option><option value="4">L4 Hard</option><option value="5">L5 Strongest</option></select></label>
  <span id="aiStatus" style="display:none; align-items:center; gap:6px; font-size:11px; color:#38bdf8; font-weight:700;"><span class="lamp on" style="background:#38bdf8; box-shadow:0 0 8px #38bdf8; display:inline-block; width:7px; height:7px; border-radius:50%;"></span><span id="aiStatusTxt">AI THINKING...</span></span>
  <span id="midi"><span class="lamp" id="lamp"></span><span id="midiTxt">MIDI: starting…</span><button id="midiBtn" title="Ask again for MIDI access">Connect</button></span>
  <label>View <select id="viewSel"><option value="table" selected>Table</option><option value="high">High</option><option value="top">Top-down</option></select></label>
  <label>Clock <select id="clockSel"><option value="0">Off</option><option value="180,2">3 + 2</option><option value="300,0" selected>5 min</option><option value="600,0">10 min</option></select></label>
  <label>Pads <select id="padCol"><option value="piece" selected>Colour per piece</option><option value="team">Colour per side</option></select></label>
  <label>Board on pads <select id="padBoard"><option value="on" selected>Checker</option><option value="off">Off</option></select></label>
  <label>Coords <select id="coords"><option value="on" selected>On</option><option value="off">Off</option></select></label>
  <label>Crush <select id="crush"><option value="0">Off</option><option value="4">4 bit</option><option value="5" selected>5 bit</option></select></label>
  <label>CRT <select id="crt"><option value="on" selected>On</option><option value="off">Off</option></select></label>
  <label>Sound <select id="snd"><option value="sfx" selected>SFX (ElevenLabs)</option><option value="synth">Synth (Retro)</option><option value="off">Off</option></select></label>
  <button id="undoBtn">Undo</button><button id="newBtn">New game</button>
  <canvas id="mirror" width="54" height="54" title="What the Launchpad shows"></canvas>
</div>
<div id="stage">
  <div id="wrap"><canvas id="screen" width="640" height="360"></canvas><div class="crt scan"></div><div class="crt vig"></div><div class="crt glow"></div></div>
  <div id="side"><h3>MOVES</h3><div id="moves"></div>
    <div id="keys"><b>Pad / click</b> a piece, then a lit square.<br><b>Side ▸ top</b> undo · <b>side ▸ bottom</b> new game (press twice)<br><b>Promotion:</b> side buttons 2–5 = Q R B N<br><b>Keys:</b> U undo · N new · V view · Esc drop piece</div>
  </div>
</div>

function lpCss(rgb, a=1) { const b = bright(rgb); return `rgba(${b[0]*4},${b[1]*4},${b[2]*4},${a})`; }
const opp = c => c === 'w' ? 'b' : 'w';
const fileOf = i => i & 7, rankOf = i => i >> 3;

  if (reason) return { winner:null, reason };
  return null;
}

  function b64ToAb(b64) { const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return u8.buffer; }

  try { init(); } catch (e) {}
  function env(node, t0, a, d, peak=1) { const g = ac.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(peak,t0+a); g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d); node.connect(g); g.connect(master); return g; }

// ───────────────────────────── game state ─────────────────────────────
const G = { camX:0, camY:0 };
const settings = { clock:[300,0], padCol:'piece', padBoard:true, coords:true, mode:'ai-b', aiLevel:3 };

let aiTimer = null;
let currentSearchId = 0;
let aiWorker = null;
let aiWatchdog = null;

function cancelAISearch() {
  currentSearchId++;
  clearTimeout(aiTimer); aiTimer = null;
  clearTimeout(aiWatchdog); aiWatchdog = null;
  if (aiWorker) { aiWorker.terminate(); aiWorker = null; }
  updateAIStatus(false);
}
window.addEventListener('pagehide', cancelAISearch);

function isAITurn() {
  if (G.over) return false;
  const mode = settings.mode;
  if (mode === 'ai-b' && G.s.turn === 'b') return true;
  if (mode === 'ai-w' && G.s.turn === 'w') return true;
  if (mode === 'ai-ai') return true;
  return false;
}

function updateAIStatus(thinking, text) {
  G.aiThinking = thinking;
  const el = document.getElementById('aiStatus');
  const txt = document.getElementById('aiStatusTxt');
  if (el) el.style.display = thinking ? 'inline-flex' : 'none';
  if (txt && text) txt.textContent = text;
}

function checkTriggerAI() {
  cancelAISearch();
  if (!isAITurn()) {
    updateAIStatus(false);
    return;
  }
  const lvlNames = { 1:'L1 EASY', 2:'L2 RELAXED', 3:'L3 STANDARD', 4:'L4 HARD', 5:'L5 STRONGEST' };
  updateAIStatus(true, `AI THINKING... [${lvlNames[settings.aiLevel] || 'L3'}]`);
  const searchId = ++currentSearchId;
  const delay = settings.mode === 'ai-ai' ? 450 : 250;
  aiTimer = setTimeout(() => {
    if (searchId !== currentSearchId || !isAITurn()) return;
    executeAISearch(searchId);
  }, delay);
}

function executeAISearch(searchId) {
  if (searchId !== currentSearchId || !isAITurn()) return;
  const fail = error => {
    if (searchId !== currentSearchId) return;
    console.error('AI worker error:', error);
    cancelAISearch();
    settings.mode = 'pvp';
    document.getElementById('modeSel').value = 'pvp';
    flashBanner('AI UNAVAILABLE', 'Human control enabled. Choose an AI mode to retry.', '#ff8a2a', 6);
  };
  let url;
  try {
    // Bundle already-loaded code: no imports/fetches inside the worker, including file:///.
    url = URL.createObjectURL(new Blob([GameRules.workerSource, '\n', ChessAI.workerSource], { type:'text/javascript' }));
    aiWorker = new Worker(url);
    aiWorker.onerror = e => { e.preventDefault(); fail(e.message); };
    aiWorker.onmessageerror = () => fail('Unreadable worker message');
    aiWorker.onmessage = ({ data }) => {
      if (data.id !== currentSearchId || searchId !== currentSearchId) return;
      if (data.type === 'progress') updateAIStatus(true, `D${data.depth} · ${Math.round(data.nodes/1000)}k`);
      else if (data.type === 'error') fail(data.message);
      else if (data.type === 'result') {
        aiWorker.terminate(); aiWorker = null;
        clearTimeout(aiWatchdog); aiWatchdog = null;
        handleAIResult(searchId, data.result);
      }
    };
    aiWatchdog = setTimeout(() => fail('Worker startup/search timed out'), 10000);
    aiWorker.postMessage({ type:'search', id:searchId, state:G.s, level:Number(settings.aiLevel)||3, historyKeys:G.keys });
  } catch (e) { fail(e); }
  finally { if (url) URL.revokeObjectURL(url); }
}

function handleAIResult(searchId, res) {
  if (searchId !== currentSearchId || !isAITurn()) return;
  updateAIStatus(false);
  if (!res || !res.move || G.over) return;
  const move = legalMoves(G.s).find(m => m.from === res.move.from && m.to === res.move.to && m.promo === res.move.promo);
  if (move) doMove(move);
}

      const fx = c.t[0], fy = c.t[1] - 2, fh = 16 * fl * c.t[2]/30;

      const g2 = ctx.createRadialGradient(fx + lean*.5, fy - fh*.5, 1, fx, fy - fh*.5, fh*2.4); g2.addColorStop(0, 'rgba(255,200,90,.55)'); g2.addColorStop(1, 'rgba(255,120,30,0)');
      ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(fx, fy - fh*.5, fh*2.4, 0, 7); ctx.fill(); ctx.globalCompositeOperation = 'source-over';
      ctx.beginPath(); ctx.moveTo(fx - fh*.28, fy); ctx.quadraticCurveTo(fx - fh*.35, fy - fh*.6, fx + lean, fy - fh*1.15); ctx.quadraticCurveTo(fx + fh*.35, fy - fh*.6, fx + fh*.28, fy); ctx.closePath();

}
function drawLamp() {   // hanging pendant entering from the top edge, swings on impacts
  const L = lampScreen();
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(L.px, L.py); ctx.lineTo(L.sx, L.sy); ctx.stroke();
  ctx.strokeStyle = '#6a6f7c'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L.px + 1, L.py); ctx.lineTo(L.sx + 1, L.sy); ctx.stroke();
  ctx.save(); ctx.translate(L.sx, L.sy); ctx.rotate(-L.a);
  ctx.globalCompositeOperation = 'lighter'; const g2 = ctx.createRadialGradient(0, 14, 2, 0, 14, 60); g2.addColorStop(0, 'rgba(255,210,140,.55)'); g2.addColorStop(1, 'rgba(255,160,80,0)'); ctx.fillStyle = g2; ctx.fillRect(-60, -40, 120, 110); ctx.globalCompositeOperation = 'source-over';
  fillPoly([[-6,-18],[6,-18],[6,-10],[-6,-10]], '#1f3838', INK, 2);                    // cap
  fillPoly([[-11,-10],[11,-10],[36,16],[-36,16]], '#2f4f4f', INK, 2.5);               // shade
  fillPoly([[11,-10],[36,16],[21,16],[6,-10]], '#203838', null);                      // its dark side
  fillPoly([[-11,-10],[-36,16],[-27,16],[-7,-10]], '#3f6868', null);                  // its lit side
  ctx.beginPath(); ctx.ellipse(0, 16, 36, 5, 0, 0, 7); ctx.fillStyle = '#fff2c8'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();   // bright rim
  ctx.beginPath(); ctx.ellipse(0, 15, 9, 3, 0, 0, 7); ctx.fillStyle = '#ffffff'; ctx.fill();   // bulb
  ctx.restore();
}
function drawLightCone(lp, lx, ly) {   // soft beam from the shade down to the table, with dust drifting through it
  const L = lampScreen();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(0, L.sy + 16, 0, lp[1]); g.addColorStop(0, 'rgba(255,205,140,.11)'); g.addColorStop(.5, 'rgba(255,190,120,.045)'); g.addColorStop(1, 'rgba(255,180,110,0)');
  ctx.fillStyle = g; polyPath([[L.sx-34, L.sy+16],[L.sx+34, L.sy+16],[lp[0]+300, lp[1]+60],[lp[0]-300, lp[1]+60]]); ctx.fill();

  for (const d of G.dust) {
    const r = (LAMP_Z - d.z)*.8 + .6, dd = Math.hypot(d.x - lx, d.y - ly); if (dd > r) continue;
    const q = P(d.x, d.y, d.z); ctx.globalAlpha = (1 - dd/r) * (.25 + .25*Math.sin(G.time*2.3 + d.ph)); ctx.fillRect(q[0]-1, q[1]-1, 2, 2);

}
function drawHud() {
  const turn = G.s.turn;
  for (const side of ['w','b']) {
    const left = side === 'w', x = left ? 8 : W - 8, active = turn === side && !G.over;
    const lost = G.captured[opp(side)].reduce((a, t) => a + VAL[t], 0) - G.captured[side].reduce((a, t) => a + VAL[t], 0);
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(left ? 4 : W - 128, 4, 124, 22);
    ctx.fillStyle = active ? TEAM[side].css : 'rgba(255,255,255,.18)'; ctx.fillRect(left ? 4 : W - 128, 4, 3, 22); ctx.fillRect(left ? 4 : W - 128, 25, 124, 1);
    text(TEAM[side].name, left ? x + 4 : x - 4, 11, 9, active ? TEAM[side].css : '#8a8f9c', left ? 'left' : 'right');
    text(lost > 0 ? '+' + lost : '', left ? x + 46 : x - 46, 11, 8, '#e6dcc3', left ? 'left' : 'right');
    if (G.clock) text(fmtClock(G.clock[side]), left ? x + 118 : x - 118, 15, 12, G.clock[side] < 10 ? '#ff5050' : active ? '#e6dcc3' : '#6a6f7c', left ? 'right' : 'left');
    text(active ? (G.promo ? 'PROMOTE' : G.sel >= 0 ? 'PICK A LIT SQUARE' : 'YOUR MOVE') : '', left ? x + 4 : x - 4, 20, 6, '#cfc6b4', left ? 'left' : 'right', 'normal');
  }
  if (G.hint) { ctx.globalAlpha = Math.min(1, G.hint.t*3); text(G.hint.text, W/2, H - 12, 9, '#ffb21a', 'center', 'bold', true); ctx.globalAlpha = 1; }
  if (G.banner) {
    const b = G.banner, k = Math.min(1, b.t/.25), s = easeOutBack(k), out = b.life < 90 ? Math.min(1, (b.life - b.t)/.3) : 1;
    ctx.globalAlpha = out; ctx.save(); ctx.translate(W/2, 64); ctx.scale(s, s);

// ───────────────────────────── post-process: crushed bits ─────────────────────────────
const crushSel = document.getElementById('crush');
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function postProcess() {
  const bits = parseInt(crushSel.value, 10); if (!bits) return;
  const step = 255 / ((1 << bits) - 1);
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  for (let y = 0; y < H; y++) { const by = (y & 3) * 4; for (let x = 0; x < W; x++) { const th = (BAYER[by + (x & 3)] / 16 - 0.5) * step, i = (y*W + x) * 4; d[i] = clamp(Math.round((d[i]+th)/step)*step, 0, 255); d[i+1] = clamp(Math.round((d[i+1]+th)/step)*step, 0, 255); d[i+2] = clamp(Math.round((d[i+2]+th)/step)*step, 0, 255); } }
  ctx.putImageData(img, 0, 0);
}

function resize() { const st = document.getElementById('stage'), aw = st.clientWidth - 240, ah = st.clientHeight - 24; const k = Math.max(1, Math.min(aw / W, ah / H)); cv.style.width = (W*k) + 'px'; cv.style.height = (H*k) + 'px'; }

}
