<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horde Prototype v1.2</title>
<style>
  :root { --bg:#07080c; --panel:#11141c; --line:#2a3040; --text:#e6dcc3; --dim:#8a8f9c; --orange:#ff5b1f; --amber:#ffb21a; --green:#3ddc84; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:"Segoe UI", system-ui, sans-serif; overflow:hidden; }
  #bar { height:44px; display:flex; align-items:center; gap:8px; padding:0 8px; background:var(--panel); border-bottom:1px solid var(--line); font-size:11px; letter-spacing:.04em; text-transform:uppercase; overflow-x:auto; scrollbar-width:none; }
  #bar::-webkit-scrollbar { display:none; }
  #bar .brand { color:var(--orange); font-weight:700; letter-spacing:.12em; white-space:nowrap; }
  #bar label { color:var(--dim); display:flex; align-items:center; gap:4px; white-space:nowrap; }
  #bar select, #bar button { background:#1a1f2b; color:var(--text); border:1px solid var(--line); border-radius:3px; padding:2px 5px; font:inherit; text-transform:uppercase; }
  #bar button:hover { border-color:var(--orange); cursor:pointer; }
  #midi { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  #midi .lamp { width:9px; height:9px; border-radius:50%; background:#444; box-shadow:0 0 0 1px #000 inset; flex:none; }
  #midi .lamp.on { background:var(--green); box-shadow:0 0 6px var(--green); }
  #midi .lamp.warn { background:var(--amber); box-shadow:0 0 6px var(--amber); }
  #help { margin-left:auto; color:var(--dim); text-align:right; font-size:10px; white-space:nowrap; }
  #mirror { width:40px; height:40px; image-rendering:pixelated; border:1px solid var(--line); border-radius:3px; background:#000; flex:none; }
  #stage { position:absolute; top:44px; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at center, #0c0f16 0%, #05060a 70%); }
  #wrap { position:relative; }
  canvas#screen { display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:#000; cursor:crosshair; }
  .crt { position:absolute; inset:0; pointer-events:none; border-radius:6px; }
  .crt.scan { background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.12) 2px 3px); mix-blend-mode:multiply; }
  .crt.vig { box-shadow:inset 0 0 85px rgba(0,0,0,.46), inset 0 0 16px rgba(0,0,0,.52); }
  #wrap.curved canvas#screen { border-radius:18px; box-shadow:0 0 0 3px #181c26, 0 12px 36px rgba(0,0,0,.75); }
  #wrap.curved .crt { border-radius:18px; }
  #wrap.curved .crt.vig { box-shadow:inset 0 0 110px rgba(0,0,0,.62), inset 0 0 28px rgba(0,0,0,.75), inset 0 2px 6px rgba(255,255,255,.08); }
  #wrap.nocrt .crt { display:none; }
</style>
<link rel="stylesheet" href="../shared/launchband-menu.css">
<script src="../shared/launchband-menu.js"></script>
</head>
<body>
<div id="bar">
  <button id="openMenuBtn" style="border-color:var(--orange); color:#fff; font-weight:800; background:rgba(255,94,26,0.18); padding:3px 8px; border-radius:3px;">⚙️ MENU / SETUP</button>
  <span class="brand">LPD · HORDE v1.2</span>
  <span id="midi"><span class="lamp" id="lamp"></span><span id="midiTxt">MIDI: starting…</span><button id="midiBtn" title="Ask again for MIDI access">Connect</button></span>
  <label>Arena <select id="layout"><option value="pad" selected>Launchpad 8×8</option><option value="keys">Keyboard 10×4</option></select></label>
  <label>Mode <select id="mode"><option value="free" selected>Free</option><option value="beat">Beat</option></select></label>
  <label>Speed <select id="diff"><option value="0.8">Easy</option><option value="1" selected>Normal</option><option value="1.25">Hard</option></select></label>
  <label>Aids <select id="aids"><option value="full">Full (labels + next step)</option><option value="medium" selected>Medium (next step)</option><option value="low">Low (none)</option></select></label>
  <label>Quality <select id="qual"><option value="high" selected>High</option><option value="low">Low</option></select></label>
  <label>Motion <select id="mot"><option value="full" selected>Full</option><option value="reduce">Reduce</option></select></label>
  <label>Crush <select id="crush"><option value="0">Off</option><option value="3">3 bit</option><option value="4" selected>4 bit</option><option value="5">5 bit</option></select></label>
  <label>CRT <select id="crt"><option value="on" selected>On</option><option value="curved">Curved</option><option value="off">Off</option></select></label>
  <label>Sound <select id="snd"><option value="sfx" selected>SFX (ElevenLabs)</option><option value="synth">Synth (Retro)</option><option value="off">Off</option></select></label>
  <canvas id="mirror" width="40" height="40" title="What the Launchpad shows"></canvas>
  <span id="help"></span>
</div>
<div id="stage"><div id="wrap"><canvas id="screen" width="640" height="360"></canvas><div class="crt scan"></div><div class="crt vig"></div></div></div>

'use strict';
// ───────────────────────────── constants ─────────────────────────────
const W = 640, H = 360;
const P = { red:'#e63b2e', red2:'#a8261c', teal:'#38b6c5', teal2:'#1f7f8c', cream:'#f3e3b8', cream2:'#d9c38f', sand3:'#b89d68', yellow:'#f5c644', yellow2:'#c4931c',
  pink:'#f4a0c0', pink2:'#c9668e', orange:'#f08a2b', orange2:'#b45a12', ink:'#141414', grey:'#6e6f78', space:'#0a0a16', green:'#5fd38a', green2:'#2c8a52',
  purple:'#a77be6', purple2:'#6a43a8', white:'#ffffff', foam:'#e9f7f3', ice:'#a8e6ff', blue:'#5aa9ff' };
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)], lerp=(a,b,t)=>a+(b-a)*t;
const cv=document.getElementById('screen'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);

// enemy types: hp, seconds per step, damage to the base, kill score, screen colours, Launchpad colour (0..63)
const T = {
  grunt:    { hp:1,  step:1.40, dmg:6,  score:20,  c1:P.green,  c2:P.green2,  lp:[ 8,63, 8], name:'GRUNT' },
  runner:   { hp:1,  step:0.70, dmg:5,  score:30,  c1:P.yellow, c2:P.yellow2, lp:[63,50, 0], name:'RUNNER' },
  brute:    { hp:3,  step:2.10, dmg:15, score:60,  c1:P.orange, c2:P.orange2, lp:[63,18, 0], name:'BRUTE' },
  splitter: { hp:2,  step:1.60, dmg:8,  score:40,  c1:P.purple, c2:P.purple2, lp:[34, 0,63], name:'SPLITTER' },
  survivor: { hp:1,  step:1.50, dmg:0,  score:0,   c1:P.white,  c2:P.teal,    lp:[40,63,63], name:'SURVIVOR' },
  boss:     { hp:12, step:3.20, dmg:35, score:400, c1:P.red,    c2:P.red2,    lp:[63, 0, 0], name:'CRAB KING' },
};

// keyboard arena: physical keys (event.code) so it works on any keyboard language; r=4 is the number row
const KEYS_ROWS = [
  { r:4, off:0,    codes:['Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7','Digit8','Digit9','Digit0'], labels:'1234567890' },
  { r:3, off:0.5,  codes:['KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP'], labels:'QWERTYUIOP' },
  { r:2, off:0.75, codes:['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon'], labels:'ASDFGHJKL;' },
  { r:1, off:1.25, codes:['KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash'], labels:'ZXCVBNM,./' },
];
const CODE2CELL = {}; KEYS_ROWS.forEach(row=>row.codes.forEach((code,i)=>CODE2CELL[code]={c:i+1,r:row.r}));

// ───────────────────────────── layouts ─────────────────────────────
// Game logic only knows columns 1..cols and rows 1..rows (row 1 touches the base, enemies come from row rows+1 = the sea).
function makeLayout(kind){
  if(kind==='pad'){
    const S=36, x0=158, y0=0;
    const rect=(c,r)=>({ x:x0+(c-1)*S, y:y0+(9-Math.min(r,9))*S, w:S, h:S });
    return { kind, cols:8, rows:8, S, stepK:1, x0, y0,
      rect, gate:c=>rect(c,9), arena:{x:x0,y:y0+S,w:8*S,h:8*S}, sea:{x:0,y:0,w:W,h:y0+S},
      base:{x:x0-8,y:y0+9*S,w:8*S+16,h:H-(y0+9*S)}, turret:{x:x0+4*S,y:y0+9*S+16},
      side:r=>({ x:x0+8*S+3, y:y0+(9-r)*S, w:S-2, h:S }),
      label:(c,r)=>'ABCDEFGH'[c-1]+r };
  }
  const S=50, x0=40, y0=60;
  const rect=(c,r)=>{ if(r>4) return { x:x0+(c-1)*S, y:y0-S, w:S, h:S }; const row=KEYS_ROWS[4-r]; return { x:x0+(row.off+c-1)*S, y:y0+(4-r)*S, w:S, h:S }; };
  return { kind, cols:10, rows:4, S, stepK:1.55, x0, y0,
    rect, gate:c=>rect(c,5), arena:{x:x0,y:y0,w:11.25*S,h:4*S}, sea:{x:0,y:0,w:W,h:y0},
    base:{x:x0+20,y:y0+4*S+8,w:11.25*S-40,h:14}, turret:{x:x0+5.6*S,y:y0+4*S+24},
    side:null, label:(c,r)=>KEYS_ROWS[4-r].labels[c-1] };
}
let L = makeLayout('pad');

  function b64ToAb(b64){ const bin=atob(b64), len=bin.length, u8=new Uint8Array(len); for(let i=0;i<len;i++) u8[i]=bin.charCodeAt(i); return u8.buffer; }
  function decodeAll(){ if(decoding||!ac) return; decoding=true; for(const [k,b64] of Object.entries(SFX_B64)) ac.decodeAudioData(b64ToAb(b64)).then(b=>{ bufs[k]=b; }).catch(()=>{}); }
  function init(){ if(!ac){ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=0.52; master.connect(ac.destination); } decodeAll(); }
  try { init(); } catch(e) {}
  function env(node,t0,a,d,peak){ const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(peak,t0+a); g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d); node.connect(g); g.connect(master); }

  function noise(d,peak=0.6,lp=1200){ if(!ac||mode==='off') return; const t=ac.currentTime; const n=Math.floor(ac.sampleRate*d); const b=ac.createBuffer(1,n,ac.sampleRate); const ch=b.getChannelData(0); for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n); const s=ac.createBufferSource(); s.buffer=b; const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; s.connect(f); env(f,t,0.005,d,peak); s.start(t); }

function getTheme(){
  const w = Math.max(1, G.wave || 1);
  if(w % 3 === 0) return TOD_THEMES[2]; // Boss wave is always dramatic Crimson Sunset
  const idx = [0, 0, 1, 2, 3, 4][(w - 1) % 5 + 1] || 0;
  return TOD_THEMES[idx];
}

// Pre-rendered static beach & sand canvas + static 2.5D keycap board canvas (rebuilt only on layout/wave/aids change)
const sandCv = document.createElement('canvas'); sandCv.width = W; sandCv.height = H;

function drawKeycapTo(c, r, sc, own, tele, pTimer, frz){
  const isKeys = L.kind === 'keys';
  const showLabel = isKeys || $('aids').value === 'full';
  const arenaCx = L.arena.x + L.arena.w * 0.5;
  const maxDepth = isKeys ? 4.8 : 3.6;
  const R = L.rect(c, r);

  const weightDip = own ? (own.moveT < 0.35 ? Math.sin(own.moveT/0.35*Math.PI)*0.35 : 0.15) : 0;
  const pressFrac = clamp(pTimer / 0.18 + weightDip, 0, 1);
  const depth = maxDepth * (1 - pressFrac * 0.78);
  const pressY = maxDepth - depth;

  const cx = R.x + R.w * 0.5;
  const skewX = ((cx - arenaCx) / (L.arena.w * 0.5)) * (isKeys ? 1.8 : 1.1);

  // 1. Recessed Socket Well (dark housing trench)
  const wx = R.x + 2, wy = R.y + 2, ww = R.w - 4, wh = R.h - 3;
  rrPath(sc, wx, wy, ww, wh, 5);
  sc.fillStyle = isKeys ? '#3b2f1e' : '#7a6338';
  sc.fill();

  let glowCol = null, sideCol = '#b89d68', topCol = P.cream, rimCol = 'rgba(255,250,230,0.75)';
  let isArmourCell = false, isWeakCell = false;

  if(own){
    if(frz){
      glowCol = P.ice; sideCol = '#3b8da8'; topCol = '#d4f3ff'; rimCol = P.white;
    } else if(own.size === 2){
      const wCell = cellsOf(own)[own.weak];
      if(wCell.c === c && wCell.r === r){
        isWeakCell = true;
        glowCol = P.pink; sideCol = '#b52b65'; topCol = '#ffd6e7'; rimCol = P.white;
      } else {
        isArmourCell = true;
        glowCol = P.red2; sideCol = '#4a2525'; topCol = '#8c5852'; rimCol = '#b87b74';
      }
    } else {
      glowCol = own.d.c1;
      sideCol = own.d.c2;
      topCol = own.type==='grunt' ? '#c8f5d6'
             : own.type==='runner' ? '#fceaa6'
             : own.type==='brute' ? '#ffd2ab'
             : own.type==='splitter' ? '#e5d4fc'
             : '#e0f7fa';
      rimCol = P.white;
    }
  } else if(tele){
    glowCol = tele.d.c1;
    topCol = '#f7ebd2';
  } else if(pTimer > 0){
    sideCol = '#9c8252';
    topCol = '#e3cfa3';
  }

  // 2. Under-key LED glow halo in the socket well when occupied or telegraphed
  if(glowCol){
    sc.save();
    sc.globalAlpha = own ? 0.72 : (0.25 + 0.18 * Math.sin(G.time * 14));
    sc.fillStyle = glowCol;
    rrPath(sc, wx - 0.5, wy - 0.5, ww + 1, wh + 1, 5.5);
    sc.fill();
    sc.restore();
  }

  // 3. 3D Keycap Extruded Side Wall / Bevel Skirt
  const kx = R.x + 3.5 + skewX * 0.35;
  const ky = R.y + 2 + pressY;
  const kw = R.w - 7;
  const kh = R.h - 4 - maxDepth;
  rrPath(sc, R.x + 3, ky + 1, R.w - 6, kh + depth, 4.5);
  sc.fillStyle = sideCol;
  sc.fill();
  sc.lineWidth = isKeys ? 1.5 : 1.1;
  sc.strokeStyle = isKeys ? '#261e12' : 'rgba(20,20,20,0.55)';
  sc.stroke();

  // 4. Keycap Top Face + Concave Dish + Specular Top Bevel
  rrPath(sc, kx, ky, kw, kh, 4);
  sc.fillStyle = topCol;
  sc.fill();

  sc.strokeStyle = rimCol;
  sc.lineWidth = 1;
  sc.beginPath();
  sc.moveTo(kx + 3, ky + 0.8);
  sc.lineTo(kx + kw - 3, ky + 0.8);
  sc.stroke();

  if(isKeys){
    rrPath(sc, kx + 3, ky + 2.5, kw - 6, kh - 5, 3);
    sc.fillStyle = own ? 'rgba(255,255,255,0.22)' : 'rgba(184,157,104,0.18)';
    sc.fill();
  }

  // 5. Key Legend
  if(showLabel){
    const lblCol = own ? P.ink : (isKeys ? '#9c8150' : '#bda26e');
    sc.font = `900 ${isKeys ? 14 : 8.5}px "Segoe UI", system-ui, sans-serif`;
    sc.textAlign = 'center'; sc.textBaseline = 'middle';
    sc.fillStyle = lblCol;
    sc.fillText(L.label(c, r), kx + kw * 0.5, ky + kh * 0.5 + 0.5);
  }

  // 6. Lit Target Highlight (corner brackets on occupied enemy cells, or armour bolts on boss non-weak cells)
  if(own){
    const bx = kx + 1.5, by = ky + 1.5, bw = kw - 3, bh = kh - 3;
    if(isArmourCell){
      sc.fillStyle = '#331818';
      sc.fillRect(bx+1, by+1, 2.5, 2.5); sc.fillRect(bx+bw-3.5, by+1, 2.5, 2.5);
      sc.fillRect(bx+1, by+bh-3.5, 2.5, 2.5); sc.fillRect(bx+bw-3.5, by+bh-3.5, 2.5, 2.5);
    } else {
      const brk = isWeakCell ? P.pink : (own.type==='survivor' ? P.teal : own.d.c1);
      sc.strokeStyle = brk;
      sc.lineWidth = 2;
      const cl = isKeys ? 6 : 4.5;
      sc.beginPath();
      sc.moveTo(bx, by+cl); sc.lineTo(bx, by); sc.lineTo(bx+cl, by);
      sc.moveTo(bx+bw-cl, by); sc.lineTo(bx+bw, by); sc.lineTo(bx+bw, by+cl);
      sc.moveTo(bx, by+bh-cl); sc.lineTo(bx, by+bh); sc.lineTo(bx+cl, by+bh);
      sc.moveTo(bx+bw-cl, by+bh); sc.lineTo(bx+bw, by+bh); sc.lineTo(bx+bw, by+bh-cl);
      sc.stroke();
    }
  }
}

function buildSandCache(){
  sandDirty = false;
  lastThemeWave = G.wave;
  lastAidsVal = $('aids').value;
  const sc = sandCtx, th = getTheme();
  sc.clearRect(0, 0, W, H);
  const shY = L.sea.h;
  const bh = H - shY;
  const skyH = L.kind === 'keys' ? 22 : 12;

  cachedSkyGrad = ctx.createLinearGradient(0, 0, 0, skyH);
  cachedSkyGrad.addColorStop(0, th.skyTop);
  cachedSkyGrad.addColorStop(1, th.skyBot);

  cachedSeaGrad = ctx.createLinearGradient(0, skyH, 0, shY);
  cachedSeaGrad.addColorStop(0, th.seaDeep);
  cachedSeaGrad.addColorStop(0.55, th.seaMid);
  cachedSeaGrad.addColorStop(1, th.seaLit);

  cachedWetGrad = ctx.createLinearGradient(0, shY - 2, 0, shY + 24);
  cachedWetGrad.addColorStop(0, th.wet);
  cachedWetGrad.addColorStop(0.65, 'rgba(65,50,28,0.22)');
  cachedWetGrad.addColorStop(1, 'rgba(65,50,28,0)');

  const bg = sc.createLinearGradient(0, shY, 0, H);
  bg.addColorStop(0, '#c7ab73');
  bg.addColorStop(0.14, '#d9c089');
  bg.addColorStop(0.55, '#e0c996');
  bg.addColorStop(1, '#ccb17a');
  sc.fillStyle = bg;
  sc.fillRect(0, shY, W, bh);

  for(let i=0; i<5; i++){
    const dy = shY + 28 + i * 62;
    sc.fillStyle = i%2===0 ? 'rgba(255,244,214,0.16)' : 'rgba(155,126,76,0.14)';
    sc.beginPath();
    sc.moveTo(0, dy);
    for(let x=0; x<=W; x+=16){
      sc.lineTo(x, dy + Math.sin(x*0.025 + i*1.7)*8 + Math.cos(x*0.011 - i)*4);
    }
    sc.lineTo(W, H); sc.lineTo(0, H); sc.closePath(); sc.fill();
  }

  let seed = 1337;
  const sRnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const tones = ['#b59860', '#c4a870', '#ebdca8', '#9e824c', '#f5e7b8'];
  for(let i=0; i<1800; i++){
    const x = Math.floor(sRnd() * W);
    const y = shY + Math.floor(sRnd() * bh);
    sc.fillStyle = tones[i % tones.length];
    sc.fillRect(x, y, i%7===0 ? 2 : 1, 1);
  }
  for(let i=0; i<45; i++){
    const side = i%2===0 ? sRnd()*135 : W - 135 + sRnd()*135;
    const x = L.kind==='pad' ? side : sRnd()*W;
    const y = shY + 14 + sRnd()*(bh - 24);
    if(x > L.arena.x - 12 && x < L.arena.x + L.arena.w + 12 && y > L.arena.y - 8 && y < L.arena.y + L.arena.h + 12) continue;
    sc.fillStyle = 'rgba(80,62,35,0.28)';
    sc.fillRect(x+1, y+1, 3, 2);
    sc.fillStyle = i%3===0 ? '#e8d8b0' : '#a88e58';
    sc.fillRect(x, y, 3, 2);
  }

  sc.fillStyle = th.sandTint;
  sc.fillRect(0, shY, W, bh);

  const props = L.kind==='pad'
    ? [[22,342,P.pink,'star'],[138,345,P.teal,'shell'],[618,92,P.red,'star'],[610,338,P.orange,'shell'],[28,165,'#d9b882','wood'],[614,218,P.pink2,'shell']]
    : [[16,132,P.pink,'star'],[624,176,P.red,'star'],[20,238,P.teal,'shell'],[618,262,P.orange,'shell']];
  for(const [x,y,c,kind] of props){
    sc.save(); sc.translate(x,y);
    sc.fillStyle = 'rgba(20,16,10,0.32)';
    sc.beginPath(); sc.ellipse(1.5, 2.5, 7, 5, 0, 0, Math.PI*2); sc.fill();
    if(kind==='star'){
      sc.beginPath();
      for(let i=0;i<10;i++){ const a=i*Math.PI/5-Math.PI/2, rad=i%2?3.2:7.5; sc.lineTo(Math.cos(a)*rad,Math.sin(a)*rad); }
      sc.closePath(); sc.fillStyle=c; sc.fill(); sc.lineWidth=1.5; sc.strokeStyle=P.ink; sc.stroke();
      sc.fillStyle='rgba(255,255,255,0.45)'; sc.fillRect(-1,-1,2,2);
    } else if(kind==='shell'){
      sc.beginPath(); sc.arc(0, 1, 6, Math.PI, 0); sc.lineTo(4, 6); sc.lineTo(-4, 6); sc.closePath();
      sc.fillStyle=c; sc.fill(); sc.lineWidth=1.5; sc.strokeStyle=P.ink; sc.stroke();
      sc.strokeStyle='rgba(20,20,20,0.45)'; sc.lineWidth=1;
      for(let s=-1;s<=1;s++){ sc.beginPath(); sc.moveTo(0,5); sc.lineTo(s*3,-3); sc.stroke(); }
    } else {
      sc.rotate(-0.25); rrPath(sc,-11,-3,22,6,2);
      sc.fillStyle='#8c683e'; sc.fill(); sc.lineWidth=1.5; sc.strokeStyle=P.ink; sc.stroke();
      sc.fillStyle='#ab8454'; sc.fillRect(-8,-1.5,16,2);
    }
    sc.restore();
  }

  // Pre-render the 2.5D Arena Board Chassis and ALL idle unpressed keycaps onto boardCv!
  const bc = boardCtx;
  bc.clearRect(0, 0, W, H);
  if(L.kind==='pad'){
    const a = L.arena;
    bc.fillStyle = 'rgba(20,15,8,0.36)';
    rrPath(bc, a.x-9, a.y+3, a.w+20, a.h+14, 8); bc.fill();
    rrPath(bc, a.x-8, a.y-3, a.w+16, a.h+12, 7);
    bc.fillStyle = '#8a703f'; bc.fill(); bc.lineWidth = 2; bc.strokeStyle = P.ink; bc.stroke();
    rrPath(bc, a.x-6, a.y-2, a.w+12, a.h+7, 6);
    bc.fillStyle = '#dec995'; bc.fill();
  } else {
    for(let r=L.rows; r>=1; r--){
      const R1 = L.rect(1, r), R2 = L.rect(L.cols, r);
      bc.fillStyle = 'rgba(20,15,8,0.30)';
      rrPath(bc, R1.x-3, R1.y+4, (R2.x+R2.w)-R1.x+8, R1.h+4, 7); bc.fill();
    }
  }
  for(let r = L.rows; r >= 1; r--){
    for(let c = 1; c <= L.cols; c++){
      drawKeycapTo(c, r, bc, null, null, 0, false);
    }
  }
}
function rrPath(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

function resetGame(toTitle=true){

    enemies:[], parts:[], floaters:[], decals:[], tracers:[], rings:[], cellFx:[], queue:[], spawnT:0, banner:null, shake:0, hurtT:0, rankPop:0, paused:false, beatAcc:0, beatN:0, beatFlash:0, spawnBeats:3, perfect:0, onBeatShot:false });

function startWave(n){
  G.wave=n; G.queue=buildQueue(n); G.waveTotal=G.queue.length; G.waveDone=0; G.spawnT=1.6; G.spawnBeats=3;
  sandDirty = true;
  G.banner={ text:'WAVE '+n, sub:n%3===0?'THE CRAB KING IS COMING':waveHint(n), t:2.4, t0:2.4 }; Snd.wave();
}
function waveHint(n){ return ({1:'HIT THE LIT PADS',2:'RUNNERS: FAST',3:'',4:'BRUTES TAKE 3 HITS · DON\'T SHOOT SURVIVORS',5:'SPLITTERS BREAK IN TWO'})[n] || 'HOLD THE BEACH'; }
function buildQueue(n){
  const pool=[['grunt',6]]; if(n>=2) pool.push(['runner',3]); if(n>=4) pool.push(['brute',2],['survivor',1]); if(n>=5) pool.push(['splitter',2]);
  if(n===3) pool.push(['runner',2]);
  const tot=pool.reduce((s,p)=>s+p[1],0), q=[], count=6+4*n;
  for(let i=0;i<count;i++){ let x=Math.random()*tot; for(const [t,w] of pool){ if((x-=w)<0){ q.push(t); break; } } }
  if(n%3===0) q.push('boss');
  return q;
}
const speedMul=()=>diff*(1+0.07*(G.wave-1));
const spawnGap=()=>Math.max(0.38,1.45-0.1*G.wave)/diff;

// footprint helpers (the boss is 2×2; (c,r) is its bottom-left cell)
function cellsOf(e){ return e.size===2?[{c:e.c,r:e.r},{c:e.c+1,r:e.r},{c:e.c,r:e.r+1},{c:e.c+1,r:e.r+1}]:[{c:e.c,r:e.r}]; }
function enemyAt(c,r){ for(const e of G.enemies){ if(e.state!=='walk') continue; for(const k of cellsOf(e)) if(k.c===c&&k.r===r) return e; } return null; }
function free(c,r,size,self){ for(let dc=0;dc<size;dc++) for(let dr=0;dr<size;dr++){ const cc=c+dc, rr=r+dr; if(cc<1||cc>L.cols) return false; if(rr<1) return false; if(rr>L.rows) continue; const o=enemyAt(cc,rr); if(o&&o!==self) return false; } return true; }

function spawn(type){
  const size=type==='boss'?2:1; const maxC=L.cols-size+1;
  const taken=new Set(G.enemies.filter(e=>e.state==='gate').flatMap(e=>e.size===2?[e.c,e.c+1]:[e.c]));
  const opts=[]; for(let c=1;c<=maxC;c++){ let ok=true; for(let d=0;d<size;d++) if(taken.has(c+d)) ok=false; if(ok) opts.push(c); }
  if(!opts.length) return false;
  const d=T[type]; const e={ id:++G.seq, type, d, size, c:pick(opts), r:L.rows+1, pc:0, pr:0, hp:d.hp, max:d.hp, t:0, step:d.step*L.stepK, moveT:1, hitT:0, squashT:0,
    state:'gate', gateT:size===2?2.2:1.1, weak:0, weakT:0, wob:Math.random()*6, face:0, every:BEATS[type], beats:0, gateBeats:size===2?4:2 };
  e.pc=e.c; e.pr=e.r; G.enemies.push(e); Snd.spawn(); return true;
}

// ───────────────────────────── input → game ─────────────────────────────
function padDown(c,r){
  Snd.init(); Snd.resume();
  if(G.mode==='title'){ if(c<=8&&r<=8) startGame(); return; }
  if(G.mode==='over'){ if(G.modeT>1.2) startGame(); return; }
  if(c===9){ if(r===8) armBomb(); else if(r===7) freeze(); return; }
  if(r===9) return;
  if(L.kind==='pad') shoot(c,r);
  else if(r>=5) shoot(c,r-4);
}
function padUp(){}
function keyCell(c,r){ Snd.init(); Snd.resume(); if(G.mode==='title'){ startGame(); return; } if(G.mode==='over'){ if(G.modeT>1.2) startGame(); return; } shoot(c,r); }

function shoot(c,r){
  if(G.mode!=='play'||G.paused) return;
  if(c>=1&&c<=L.cols&&r>=1&&r<=L.rows) KEY_PRESS[cellIdx(c,r)] = 0.18;
  G.shots++; aimAt(c,r); Snd.shot();
  G.onBeatShot = beatMode && Math.min(G.beatAcc, G.beatLen-G.beatAcc) < ON_BEAT;
  if(G.armed){ G.armed=false; G.bombs--; blast(c,r); return; }
  const e=enemyAt(c,r);
  if(!e){ miss(c,r); return; }
  if(e.type==='survivor'){ G.hits++; friendlyFire(e,c,r); return; }
  if(e.type==='boss'){ const w=cellsOf(e)[e.weak]; if(w.c!==c||w.r!==r){ armour(c,r); return; } }
  G.hits++; damage(e,1,c,r);
}
function aimAt(c,r){ const R=L.rect(c,r); const tx=R.x+R.w/2, ty=R.y+R.h/2; G.turretAng=Math.atan2(ty-L.turret.y,tx-L.turret.x); G.muzzleT=0.08; G.tracers.push({x:tx,y:ty,t:0.09,t0:0.09}); }
function cellFx(c,r,kind,t=0.28){ G.cellFx.push({c,r,kind,t,t0:t}); if(kind==='bomb'&&c>=1&&c<=L.cols&&r>=1&&r<=L.rows) KEY_PRESS[cellIdx(c,r)]=0.26; }

function addCombo(){ const before=rank(); G.combo++; G.comboT=3; G.best=Math.max(G.best,G.combo); if(rank()!==before){ G.rankPop=1; Snd.rank(); floatAt(L.turret.x,L.turret.y-40,'RANK '+rank()+'!',P.yellow,14); } }
function breakCombo(why){ if(G.combo>=5) floatAt(L.turret.x,L.turret.y-30,why||'COMBO LOST',P.red,10); G.combo=0; G.comboT=0; }
const mult=()=>Math.min(8,1+Math.floor(G.combo/5));
function rank(){ const c=G.combo; return c>=35?'S':c>=20?'A':c>=10?'B':c>=5?'C':'D'; }

function damage(e,n,c,r){
  e.hp-=n; e.hitT=0.2; e.squashT=e.type==='brute'?0.34:0.18; addCombo(); const bx=G.onBeatShot?2:1; const pts=10*mult()*bx; G.score+=pts;
  if(G.onBeatShot){ G.perfect++; G.onBeatShot=false; const Q=L.rect(c,r); floatAt(Q.x+Q.w/2,Q.y-10,'ON BEAT ×2',P.pink,10); G.beatBonus=true; }
  const R=L.rect(c,r); cellFx(c,r,'hit'); burst(R.x+R.w/2,R.y+R.h/2,P.white,8,115,true); floatAt(R.x+R.w/2,R.y+4,'+'+pts,P.cream,9);
  if(e.hp<=0){ kill(e); return; }
  Snd.hit(G.combo);
  if(e.type==='brute'&&e.r<L.rows&&free(e.c,e.r+1,1,e)){ e.pc=e.c; e.pr=e.r; e.r++; e.moveT=0; e.t=0; e.squashT=0.38; floatAt(R.x+R.w/2,R.y-4,'PUSH',P.orange,8); }
  if(e.type==='boss'){ e.weak=(e.weak+1+Math.floor(Math.random()*3))%4; e.weakT=0; G.shake=Math.max(G.shake,3); }
}
function kill(e){
  const k=cellsOf(e), cx=k.reduce((s,q)=>s+L.rect(q.c,q.r).x+L.S/2,0)/k.length, cy=k.reduce((s,q)=>s+L.rect(q.c,q.r).y+L.S/2,0)/k.length;
  G.enemies.splice(G.enemies.indexOf(e),1); G.kills++; G.waveDone++;
  const bonus=e.d.score*mult()*(G.beatBonus?2:1); G.beatBonus=false; G.score+=bonus; Snd.kill(G.combo);
  burst(cx,cy,e.d.c1,e.size===2?40:16,e.size===2?220:140,true); burst(cx,cy,P.ink,6,80);
  G.decals.push({x:cx,y:cy,col:e.d.c2,t:5,s:e.size===2?1.8:1, seed:Math.random()*9});
  if(e.size===2){ G.shake=10; G.rings.push({x:cx,y:cy,t:0.5,t0:0.5,r0:10,r1:120,col:P.red}); floatAt(cx,cy-20,'KING DOWN +'+bonus,P.yellow,14); }
  G.charge=Math.min(100,G.charge+7);
  if(G.kills%20===0&&G.bombs<3){ G.bombs++; floatAt(L.turret.x,L.turret.y-52,'BOMB +1',P.orange,11); }
  if(e.type==='splitter'){
    G.rings.push({x:cx,y:cy,t:0.32,t0:0.32,r0:4,r1:L.S*1.15,col:P.purple});
    burst(cx,cy,P.white,10,130,true);
    floatAt(cx,cy-10,'SPLIT!',P.purple,9);
    for(const dc of [-1,1]){ const c=e.c+dc; if(c>=1&&c<=L.cols&&free(c,e.r,1,null)){ const g={ id:++G.seq, type:'grunt', d:T.grunt, size:1, c, r:e.r, pc:e.c, pr:e.r, hp:1, max:1, t:-0.3, step:T.grunt.step*L.stepK, moveT:0, hitT:0.15, squashT:0.36, state:'walk', gateT:0, weak:0, weakT:0, wob:Math.random()*6, face:dc, every:BEATS.grunt, beats:0, gateBeats:0 }; G.enemies.push(g); G.waveTotal++; } }
  }
}
function miss(c,r){ const R=L.rect(c,r); cellFx(c,r,'miss',0.36); burst(R.x+R.w/2,R.y+R.h*0.7,P.cream2,8,60); Snd.miss(); breakCombo(); }
function armour(c,r){ const R=L.rect(c,r); cellFx(c,r,'armour',0.22); burst(R.x+R.w/2,R.y+R.h/2,P.yellow,8,135,true); floatAt(R.x+R.w/2,R.y+6,'ARMOUR',P.grey,8); Snd.clank(); }
function friendlyFire(e,c,r){ const R=L.rect(c,r); G.enemies.splice(G.enemies.indexOf(e),1); G.waveDone++; burst(R.x+R.w/2,R.y+R.h/2,P.teal,12,100); cellFx(c,r,'miss',0.5);
  hurt(10,R.x+R.w/2,R.y); floatAt(R.x+R.w/2,R.y-8,'FRIENDLY! -10',P.red,11); Snd.oops(); breakCombo('COMBO LOST'); }

function armBomb(){ if(G.mode!=='play') return; if(G.armed){ G.armed=false; Snd.deny(); return; } if(G.bombs<=0){ Snd.deny(); floatAt(L.turret.x,L.turret.y-40,'NO BOMBS',P.grey,10); return; } G.armed=true; Snd.arm(); }
function blast(c,r){
  const R=L.rect(c,r), x=R.x+R.w/2, y=R.y+R.h/2; Snd.bomb(); G.shake=11;
  // Dual expanding shockwave rings (outer fire wave + fast inner white/yellow pressure wave)
  G.rings.push({x,y,t:0.48,t0:0.48,r0:6,r1:L.S*2.15,col:P.orange});
  G.rings.push({x,y,t:0.28,t0:0.28,r0:4,r1:L.S*1.55,col:P.white});
  burst(x,y,P.orange,32,210,true); burst(x,y,P.yellow,18,150,true);
  const hitList=new Set(); for(let dc=-1;dc<=1;dc++) for(let dr=-1;dr<=1;dr++){ const cc=c+dc, rr=r+dr; if(cc<1||cc>L.cols||rr<1||rr>L.rows) continue; cellFx(cc,rr,'bomb',0.48); const e=enemyAt(cc,rr); if(e) hitList.add(e); }
  let any=false; for(const e of hitList){ if(e.type==='survivor'){ friendlyFire(e,e.c,e.r); continue; } any=true; const k=cellsOf(e)[0]; damage(e,Math.min(2,e.hp),k.c,k.r); }
  if(any) G.hits++; else breakCombo();
}
function freeze(){ if(G.mode!=='play') return; if(G.charge<100||G.freezeT>0){ Snd.deny(); return; } G.charge=0; G.freezeT=4; Snd.freeze(); G.rings.push({x:W/2,y:H/2,t:0.6,t0:0.6,r0:10,r1:420,col:P.ice}); }
function togglePause(){ if(G.mode==='play') G.paused=!G.paused; }

function hurt(n,x,y){ G.hp=Math.max(0,G.hp-n); G.hurtT=0.45; G.shake=Math.max(G.shake,9); if(G.hp<=0) gameOver(); }
function reachBase(e){
  const R=L.rect(e.c,1), x=R.x+(e.size===2?L.S:L.S/2), y=L.base.y+6;
  G.enemies.splice(G.enemies.indexOf(e),1); G.waveDone++;
  if(e.type==='survivor'){ G.saved++; G.hp=Math.min(100,G.hp+5); G.score+=100; floatAt(x,y-10,'SAVED +5 HP',P.teal,10); burst(x,y,P.teal,12,90,true); Snd.saved(); return; }
  Snd.base(); burst(x,y,P.cream2,18,160,true); burst(x,y,e.d.c1,10,120); floatAt(x,y-14,'-'+e.d.dmg,P.red,13); breakCombo('BASE HIT');
  hurt(e.d.dmg,x,y);
}
function gameOver(){ if(G.mode==='over') return; setMode('over'); Snd.lose(); G.shake=14; }

function stepEnemy(e){
    if(e.r-1<1){ reachBase(e); return G.mode!=='play'?'end':'base'; }
    let nc=e.c;
    if(e.type==='runner'&&Math.random()<0.3){ const dc=pick([-1,1]); if(free(e.c+dc,e.r-1,1,e)) nc=e.c+dc; }
    if(free(nc,e.r-1,e.size,e)){ e.pc=e.c; e.pr=e.r; e.c=nc; e.r--; e.moveT=0; e.face=nc-e.pc; }
    else if(e.size===1){ const opts=[-1,1].filter(dc=>free(e.c+dc,e.r,1,e)); if(opts.length&&Math.random()<0.6){ const dc=pick(opts); e.pc=e.c; e.pr=e.r; e.c+=dc; e.moveT=0; e.face=dc; } else blocked(e); }
    else blocked(e);
  return 'ok';
}
function blocked(e){ if(beatMode) e.beats=e.every-1; else e.t=e.step*0.55; }
function onBeat(frozen){
  G.beatN++; G.beatFlash=1; const pos=(G.beatN-1)%4; if(pos===0||pos===2) Snd.kick(); else Snd.snare(); Snd.tick();
  if(G.queue.length){ G.spawnBeats--; if(G.spawnBeats<=0){ if(spawn(G.queue[0])){ G.queue.shift(); G.spawnBeats=Math.max(1,Math.round(spawnGap()/G.beatLen*rnd(0.6,1.3))); if(G.wave>=3&&Math.random()<0.22) G.spawnBeats=1; } else G.spawnBeats=1; } }
  if(frozen) return;
  for(const e of [...G.enemies]){
    if(e.state==='gate'){ e.gateBeats--; if(e.gateBeats<=0){ const r=L.rows-e.size+1; if(free(e.c,r,e.size,e)){ e.state='walk'; e.pc=e.c; e.pr=e.r; e.r=r; e.moveT=0; e.t=0; e.beats=0; } else e.gateBeats=1; } continue; }
    e.beats++; if(e.beats<e.every) continue; e.beats=0;
    if(stepEnemy(e)==='end') return;
  }
}

// ───────────────────────────── particles & text ─────────────────────────────
function burst(x,y,col,n,sp,sparks=false){
  const cnt = $('qual').value==='low' ? Math.ceil(n*0.5) : n;
  for(let i=0;i<cnt;i++){
    const a=Math.random()*Math.PI*2, v=rnd(0.3,1)*sp;
    G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,t:rnd(0.25,0.58),col,s:Math.random()<0.35?3:2,spark:sparks&&i%2===0});
  }
}
function floatAt(x,y,txt,col,size){ G.floaters.push({x,y,txt,col,size,t:0.9,t0:0.9}); }

// ───────────────────────────── update ─────────────────────────────
function update(dt){
  G.time+=dt; G.modeT+=dt;
  G.shake=Math.max(0,G.shake-dt*30); G.hurtT=Math.max(0,G.hurtT-dt); G.rankPop=Math.max(0,G.rankPop-dt*2.8); G.muzzleT=Math.max(0,G.muzzleT-dt);
  if(G.hpTrail===undefined || G.hp>G.hpTrail) G.hpTrail=G.hp;
  else if(G.hp<G.hpTrail) G.hpTrail=Math.max(G.hp, G.hpTrail-dt*22);
  for(let i=0;i<120;i++) if(KEY_PRESS[i]>0) KEY_PRESS[i]=Math.max(0,KEY_PRESS[i]-dt);
  for(const p of G.parts){ p.t-=dt; p.vy+=260*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; } G.parts=G.parts.filter(p=>p.t>0);
  for(const f of G.floaters){ f.t-=dt; f.y-=22*dt; } G.floaters=G.floaters.filter(f=>f.t>0);
  for(const d of G.decals) d.t-=dt; G.decals=G.decals.filter(d=>d.t>0);
  for(const t of G.tracers) t.t-=dt; G.tracers=G.tracers.filter(t=>t.t>0);
  for(const r of G.rings) r.t-=dt; G.rings=G.rings.filter(r=>r.t>0);
  for(const f of G.cellFx) f.t-=dt; G.cellFx=G.cellFx.filter(f=>f.t>0);
  if(G.banner){ G.banner.t-=dt; if(G.banner.t<=0) G.banner=null; }
  if(G.mode==='title') return;
  if(G.mode==='over'){ for(const e of G.enemies) e.hitT=Math.max(0,e.hitT-dt); return; }
  if(G.mode==='inter'){ if(G.modeT>3){ setMode('play'); startWave(G.wave+1); } return; }
  if(G.paused) return;

  if(G.comboT>0){ G.comboT-=dt; if(G.comboT<=0) breakCombo('COMBO TIMED OUT'); }
  const frozen=G.freezeT>0; if(frozen) G.freezeT-=dt;

  if(beatMode){ G.beatLen=60/bpm(); G.beatAcc+=dt; G.beatFlash=Math.max(0,G.beatFlash-dt*5); while(G.beatAcc>=G.beatLen){ G.beatAcc-=G.beatLen; onBeat(frozen); if(G.mode!=='play') return; } }
  else if(G.queue.length){ G.spawnT-=dt; if(G.spawnT<=0){ if(spawn(G.queue[0])){ G.queue.shift(); G.spawnT=spawnGap()*rnd(0.6,1.3); if(G.wave>=3&&Math.random()<0.22) G.spawnT=0.12; } else G.spawnT=0.2; } }

  for(const e of [...G.enemies]){
    e.hitT=Math.max(0,e.hitT-dt); e.squashT=Math.max(0,(e.squashT||0)-dt); e.moveT=Math.min(1,e.moveT+dt*7);
    if(e.size===2){ e.weakT+=dt; if(e.weakT>1.8){ e.weakT=0; e.weak=(e.weak+1)%4; } }
    if(beatMode){ const f=G.beatAcc/G.beatLen; if(e.state==='walk') e.t=clamp((e.beats+f)/e.every,0,1)*e.step; else e.gateT=clamp((e.gateBeats-f)/(e.size===2?4:2),0,1)*(e.size===2?2.2:1.1); continue; }
    if(frozen) continue;
    if(e.state==='gate'){ e.gateT-=dt; if(e.gateT<=0){ const r=L.rows-e.size+1; if(free(e.c,r,e.size,e)){ e.state='walk'; e.pc=e.c; e.pr=e.r; e.r=r; e.moveT=0; e.t=0; } else e.gateT=0.25; } continue; }
    e.t+=dt*speedMul();
    if(e.t<e.step) continue;
    e.t=0;
    if(stepEnemy(e)==='end') return;
  }
  if(!G.queue.length&&!G.enemies.length){ setMode('inter'); G.hp=Math.min(100,G.hp+10); G.banner={text:'WAVE '+G.wave+' CLEAR',sub:'+10 HP · NEXT WAVE INCOMING',t:3,t0:3}; Snd.wave(); }
}

// ───────────────────────────── drawing helpers ─────────────────────────────
function text(t,x,y,size=8,color=P.cream,align='left',outline=true){
  const rx = Math.round(x), ry = Math.round(y);
  ctx.font = `900 ${size}px "Consolas", "Lucida Console", "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  if(outline){
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2.2, size * 0.26);
    ctx.strokeStyle = P.ink;
    ctx.strokeText(t, rx, ry + (size >= 14 ? 1 : 0.5));
    ctx.strokeText(t, rx, ry);
  }
  ctx.fillStyle = color;
  ctx.fillText(t, rx, ry);
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); cTo(x,y,w,h,r); }
function cTo(x,y,w,h,r){ ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fillOut(fill,lw=2){ ctx.fillStyle=fill; ctx.fill(); ctx.lineWidth=lw; ctx.strokeStyle=P.ink; ctx.stroke(); }
function ell(x,y,rx,ry){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); }

function drawSea(){
  if(sandDirty || lastThemeWave !== G.wave || lastAidsVal !== $('aids').value) buildSandCache();
  const s = L.sea, th = getTheme(), low = $('qual').value === 'low';
  const skyH = L.kind === 'keys' ? 22 : 12;
  ctx.fillStyle = cachedSkyGrad;
  ctx.fillRect(0, 0, W, skyH);

  const sunX = W * 0.5 + (L.kind==='pad' ? -195 : 220);
  ctx.fillStyle = th.sun;
  ctx.globalAlpha = 0.85;
  ell(sunX, skyH - 2, L.kind==='keys'?11:7, L.kind==='keys'?11:7); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = th.seaDeep;
  ctx.beginPath();
  ctx.moveTo(18, skyH); ctx.lineTo(38, skyH-6); ctx.lineTo(52, skyH-3); ctx.lineTo(68, skyH-8); ctx.lineTo(92, skyH);
  ctx.moveTo(535, skyH); ctx.lineTo(558, skyH-7); ctx.lineTo(582, skyH-4); ctx.lineTo(605, skyH);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = cachedSeaGrad;
  ctx.fillRect(0, skyH, W, s.h - skyH);

  ctx.fillStyle = th.sun;
  ctx.globalAlpha = 0.22;
  for(let y = skyH + 2; y < s.h - 6; y += 4){
    const sw = 10 + (y - skyH)*0.55 + Math.sin(G.time*3 + y*0.4)*5;
    ctx.fillRect(sunX - sw/2, y, sw, 2);
  }
  ctx.globalAlpha = 1;

  const stepY = low ? 10 : 6;
  for(let y = skyH + 3; y < s.h - 4; y += stepY){
    const depth = (y - skyH) / Math.max(1, s.h - skyH);
    ctx.fillStyle = depth > 0.55 ? th.foam : th.seaLit;
    ctx.globalAlpha = 0.28 + depth * 0.42;
    const speed = 1.1 + depth * 1.4;
    for(let x = -24; x < W + 24; x += 44){
      const o = Math.sin(G.time * speed + y * 0.25 + x * 0.04) * (5 + depth * 4);
      const rw = 16 + depth * 12;
      ctx.fillRect(x + o + ((y / stepY | 0) % 2) * 21, y, rw, depth > 0.7 ? 2.5 : 1.8);
    }
  }
  ctx.globalAlpha = 1;
}

// ───────────────────────────── STEP 3: 2.5D BEVELLED KEYCAPS & LIT TARGET HIGHLIGHTS ─────────────────────────────
function drawBeach(){
  ctx.drawImage(sandCv, 0, 0);

  const s = L.sea, th = getTheme();
  const tide = Math.sin(G.time * 1.6) * 3.5 + Math.sin(G.time * 0.7) * 2;
  const wetDepth = 16 + tide * 1.4;
  ctx.fillStyle = cachedWetGrad;
  ctx.fillRect(0, s.h - 2, W, wetDepth + 4);

  ctx.strokeStyle = 'rgba(233,247,243,0.28)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for(let x = 0; x <= W; x += 10){
    const wy = s.h + 7 + Math.sin(G.time * 1.6 - 0.8 + x * 0.06) * 2.5;
    if(x===0) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
  }
  ctx.stroke();

  ctx.fillStyle = 'rgba(31,127,140,0.45)';
  ctx.beginPath();
  ctx.moveTo(0, s.h - 6);
  for(let x = 0; x <= W; x += 8){
    ctx.lineTo(x, s.h + 2 + tide * 0.7 + Math.sin(G.time * 2.1 + x * 0.07) * 2.8);
  }
  ctx.lineTo(W, s.h - 6); ctx.closePath(); ctx.fill();

  ctx.fillStyle = th.foam;
  ctx.beginPath();
  ctx.moveTo(0, s.h - 2);
  for(let x = 0; x <= W; x += 8){
    ctx.lineTo(x, s.h - 4 + tide * 0.5 + Math.sin(G.time * 2.2 + x * 0.07) * 2.8);
  }
  for(let x = W; x >= 0; x -= 8){
    ctx.lineTo(x, s.h + 1.5 + tide * 0.65 + Math.cos(G.time * 1.9 + x * 0.09) * 2.2);
  }
  ctx.closePath(); ctx.fill();

  // Draw the pre-rendered 2.5D board chassis and all idle keycaps in a single blit!
  ctx.drawImage(boardCv, 0, 0);

  // Populate cell ownership & telegraph tables (zero object allocation)
  CELL_OWNER.fill(null);
  CELL_TELE.fill(null);
  const showTele = $('aids').value !== 'low';
  const frz = G.freezeT > 0;
  for(const e of G.enemies){
    if(e.state === 'gate'){
      if(showTele){
        for(let d=0; d<e.size; d++) CELL_TELE[cellIdx(e.c+d, L.rows)] = e;
      }
      continue;
    }
    if(e.size === 2){
      CELL_OWNER[cellIdx(e.c, e.r)] = e;
      CELL_OWNER[cellIdx(e.c+1, e.r)] = e;
      CELL_OWNER[cellIdx(e.c, e.r+1)] = e;
      CELL_OWNER[cellIdx(e.c+1, e.r+1)] = e;
    } else {
      CELL_OWNER[cellIdx(e.c, e.r)] = e;
    }
    if(showTele && !frz && e.r > 1 && (e.t / e.step) > 0.55){
      for(let d=0; d<e.size; d++){
        const idx = cellIdx(e.c+d, e.r-1);
        if(!CELL_OWNER[idx]) CELL_TELE[idx] = e;
      }
    }
  }

  // Only redraw keycaps that are active (occupied, telegraphed, or pressed down!)
  for(let r = L.rows; r >= 1; r--){
    for(let c = 1; c <= L.cols; c++){
      const idx = cellIdx(c, r);
      const own = CELL_OWNER[idx];
      const tele = CELL_TELE[idx];
      const pTimer = KEY_PRESS[idx];
      if(own || tele || pTimer > 0){
        drawKeycapTo(c, r, ctx, own, tele, pTimer, frz);
      }
    }
  }
}

function drawBase(){
  const b = L.base, th = getTheme();
  ctx.fillStyle = th.shadowCol;
  rr(b.x - 4, b.y + 3, b.w + 8, b.h + 20, 7); ctx.fill();

  rr(b.x, b.y, b.w, b.h + 20, 6); fillOut('#165a66', 2);
  ctx.fillStyle = '#0f3f47';
  ctx.fillRect(b.x + 2, b.y + 10, b.w - 4, b.h + 8);
  rr(b.x + 3, b.y + 3, b.w - 6, 9, 3); fillOut(P.teal, 1.5);
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillRect(b.x + 6, b.y + 4, b.w - 12, 2);

  ctx.fillStyle = '#0a292e';
  for(let x = b.x + 14; x < b.x + b.w - 10; x += 24) ctx.fillRect(x, b.y + 14, 2, 2);

  for(let x = b.x + 6; x < b.x + b.w - 14; x += 18){
    const hurtFlash = G.hurtT > 0 && ($('mot').value !== 'reduce') && Math.floor(G.time * 20) % 2 === 0;
    ell(x + 8, b.y + 3.5, 9.5, 5); ctx.fillStyle = 'rgba(15,12,8,0.35)'; ctx.fill();
    ell(x + 8, b.y + 1.5, 9, 4.8);
    fillOut(hurtFlash ? P.red : '#d9c38f', 1.5);
    ctx.fillStyle = hurtFlash ? '#ff8a80' : '#f3e3b8';
    ctx.fillRect(x + 4, b.y - 1, 8, 1.5);
    ctx.strokeStyle = 'rgba(90,70,40,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 8, b.y - 2); ctx.lineTo(x + 8, b.y + 5); ctx.stroke();
  }

  const t = L.turret;
  const rec = G.muzzleT > 0 ? (G.muzzleT / 0.08) * 4.5 : 0;
  ell(t.x + th.lx * 6, t.y + 4, 15, 12); ctx.fillStyle = th.shadowCol; ctx.fill();
  ell(t.x, t.y + 1, 15, 12.5); fillOut('#454954', 2);

  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.rotate(G.turretAng);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(2 - rec, -2, 24, 9);
  rr(4 - rec, -3.5, 22, 7, 2); fillOut(P.grey, 2);
  ctx.fillStyle = '#9ea3b0'; ctx.fillRect(6 - rec, -2, 18, 2);
  rr(0 - rec, -5, 11, 10, 2); fillOut('#50535c', 1.8);
  ctx.fillStyle = P.ink; ctx.fillRect(23 - rec, -4.5, 4, 9);
  if(G.muzzleT > 0){
    // Multi-petal directional muzzle flash cone + bright core
    ctx.fillStyle = P.orange;
    ctx.beginPath();
    ctx.moveTo(25, -3); ctx.lineTo(38, -8); ctx.lineTo(33, -2); ctx.lineTo(42, 0);
    ctx.lineTo(33, 2); ctx.lineTo(38, 8); ctx.lineTo(25, 3); ctx.closePath();
    ctx.fill();
    ell(29, 0, 7.5, 5); fillOut(P.yellow, 1.4);
    ell(27, 0, 4, 2.8); ctx.fillStyle = P.white; ctx.fill();
  }
  ctx.restore();

  ell(t.x, t.y, 13, 11); fillOut(G.armed ? P.orange : P.red2, 2);
  ell(t.x, t.y - 1.5, 11, 8.5); ctx.fillStyle = G.armed ? P.yellow : P.red; ctx.fill();
  ell(t.x - 3.5, t.y - 4, 4.5, 3); ctx.fillStyle = G.armed ? P.white : P.pink; ctx.fill();
}

function enemyPos(e){
  const ease=1-Math.pow(1-e.moveT,3);
  const a=L.rect(e.pc,e.pr), b=L.rect(e.c,e.r);
  let x=lerp(a.x,b.x,ease)+L.S/2, y=lerp(a.y,b.y,ease)+L.S/2;
  if(e.size===2){ const b2=L.rect(e.c+1,e.r+1), a2=L.rect(e.pc+1,Math.min(e.pr+1,L.rows+1)); x=(lerp(a.x,b.x,ease)+lerp(a2.x,b2.x,ease)+L.S)/2; y=(lerp(a.y,b.y,ease)+lerp(a2.y,b2.y,ease)+L.S)/2; }
  y-=Math.sin(Math.PI*e.moveT)*6;
  return {x,y};
}

// ───────────────────────────── STEP 2: ENEMIES (SILHOUETTES, 3-FRAME WALK, SPLASH, SQUASH, ARMOUR) ─────────────────────────────
function drawEnemy(e){
  const {x,y} = enemyPos(e);
  const d = e.d;
  const S = L.S * (e.size===2 ? 2 : 1);
  const frz = G.freezeT > 0;
  const reduceMot = $('mot').value === 'reduce';
  const animRate = e.type==='runner' ? 14 : e.type==='brute' ? 6.5 : 9.5;
  const frame = frz ? 1 : Math.floor(G.time * animRate + e.wob * 2) % 3;
  const stride = frame === 0 ? -1 : frame === 2 ? 1 : 0;
  const bob = frz ? 0 : (frame === 1 ? -1.6 : 0.8) + Math.sin(G.time*8+e.wob)*0.8;
  const flash = e.hitT > 0 && (reduceMot ? true : Math.floor(e.hitT*30)%2===0);
  const c1 = flash ? P.white : frz ? P.ice : d.c1;
  const c2 = flash ? P.cream : frz ? P.teal : d.c2;

  let sub = 0;
  if(e.state==='gate'){
    const k = e.size===2 ? 2.2 : 1.1;
    sub = clamp(e.gateT / k, 0, 1);
  }
  const th = getTheme();
  const k = S / 36;

  const sq = (e.squashT || 0) / 0.36;
  const hopStretch = e.moveT < 1 ? Math.sin(e.moveT * Math.PI) * 0.14 : 0;
  const sx = 1 + sq * 0.36 - hopStretch * 0.5;
  const sy = 1 - sq * 0.28 + hopStretch;

  ctx.save();
  ctx.translate(x, y + bob + sub * S * 0.28);

  if(e.state === 'gate'){
    const spR = S * (0.42 + (1 - sub) * 0.15);
    ctx.strokeStyle = th.foam;
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.75;
    ell(0, S*0.18, spR, S*0.14); ctx.stroke();
    ctx.globalAlpha = 1;
  } else {
    ell(th.lx * S * 0.16, S * 0.33, S * 0.34 * sx, S * 0.10);
    ctx.fillStyle = th.shadowCol;
    ctx.fill();
  }

  ctx.save();
  ctx.scale(sx, sy);

  if(e.type === 'boss'){
    for(const s of [-1, 1]){
      for(let l=0; l<3; l++){
        const legPhase = ((frame + l) % 3) - 1;
        const ly = (-2 + l * 5) * k;
        const lxOuter = (21 + l * 2) * k + legPhase * 2.2 * k;
        const lyTip = (6 + l * 4.5 + Math.abs(legPhase)*2) * k;
        ctx.beginPath();
        ctx.moveTo(s * 14 * k, ly);
        ctx.lineTo(s * lxOuter, ly - 2 * k);
        ctx.lineTo(s * (lxOuter - 2 * k), lyTip);
        ctx.lineWidth = 3 * k * 0.65;
        ctx.lineCap = 'round';
        ctx.strokeStyle = P.ink; ctx.stroke();
        ctx.lineWidth = 1.6 * k * 0.65;
        ctx.strokeStyle = c2; ctx.stroke();
      }
      const clawLift = stride * s * 2.2 * k;
      ctx.beginPath();
      ctx.moveTo(s * 15 * k, -2 * k);
      ctx.lineTo(s * 25 * k, -10 * k + clawLift);
      ctx.lineWidth = 4.5; ctx.strokeStyle = P.ink; ctx.stroke();
      ctx.lineWidth = 2.5; ctx.strokeStyle = c2; ctx.stroke();
      ctx.save();
      ctx.translate(s * 27 * k, -12 * k + clawLift);
      ell(0, 0, 7.5 * k, 6 * k); fillOut(c1, 2);
      ctx.fillStyle = P.yellow;
      ctx.beginPath(); ctx.moveTo(0, -2*k); ctx.lineTo(-s*5*k, -5*k); ctx.lineTo(-s*2*k, 1*k); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    ell(0, 0, 22 * k, 14.5 * k); fillOut(c2, 2.5);
    ell(0, -2.5 * k, 19.5 * k, 11.5 * k); ctx.fillStyle = c1; ctx.fill();

    const qOffsets = [[-8.5*k, 4*k], [8.5*k, 4*k], [-8.5*k, -5*k], [8.5*k, -5*k]];
    for(let qi=0; qi<4; qi++){
      const [qx, qy] = qOffsets[qi];
      if(qi === e.weak){
        ell(qx, qy, 5.5*k, 4*k);
        fillOut('#4a0e2e', 1.5);
        const pulse = 0.7 + 0.3 * Math.sin(G.time * 14);
        ell(qx, qy, 4.2*k*pulse, 3*k*pulse);
        ctx.fillStyle = P.pink; ctx.fill();
        ell(qx, qy, 2.2*k, 1.6*k);
        ctx.fillStyle = P.white; ctx.fill();
      } else {
        rr(qx - 6*k, qy - 3.5*k, 12*k, 7*k, 2*k);
        fillOut(flash ? P.cream : '#59252a', 1.5);
        ctx.fillStyle = '#8c3b42';
        ctx.fillRect(qx - 4.5*k, qy - 2*k, 9*k, 2*k);
        ctx.fillStyle = P.cream2;
        ctx.fillRect(qx - 4.5*k, qy + 1*k, 1.5*k, 1.5*k);
        ctx.fillRect(qx + 3*k, qy + 1*k, 1.5*k, 1.5*k);
      }
    }

    for(let i=-1; i<=1; i++){
      ctx.beginPath();
      ctx.moveTo(i*5*k - 2*k, -12*k); ctx.lineTo(i*5*k, -17*k); ctx.lineTo(i*5*k + 2*k, -12*k);
      ctx.closePath(); fillOut(P.yellow, 1.5);
    }
    for(const s of [-1, 1]){
      ctx.beginPath(); ctx.moveTo(s*6*k, -10*k); ctx.lineTo(s*8.5*k, -20*k);
      ctx.lineWidth = 3; ctx.strokeStyle = P.ink; ctx.stroke();
      ell(s*8.5*k, -21*k, 4.2*k, 4.2*k); fillOut(P.white, 1.8);
      ell(s*8.5*k, -20*k, 1.8*k, 2.1*k); ctx.fillStyle = P.ink; ctx.fill();
      ctx.beginPath(); ctx.moveTo(s*12*k, -24*k); ctx.lineTo(s*4.5*k, -21.5*k);
      ctx.lineWidth = 2.2; ctx.strokeStyle = P.ink; ctx.stroke();
    }

  } else if(e.type === 'survivor'){
    const lFoot = stride * 2.5 * k, rFoot = -stride * 2.5 * k;
    ell(-3.5*k, 12*k + lFoot, 2.6*k, 1.8*k); fillOut(P.ink, 1);
    ell(3.5*k, 12*k + rFoot, 2.6*k, 1.8*k); fillOut(P.ink, 1);
    rr(-6.5*k, -4*k, 13*k, 16*k, 4*k); fillOut(flash ? P.cream : P.white, 2);
    ctx.fillStyle = P.teal; ctx.fillRect(-5.5*k, -3*k, 11*k, 7*k);
    ctx.fillStyle = P.yellow; ctx.fillRect(-5.5*k, 1*k, 11*k, 1.8*k);
    ell(0, 5*k, 9.5*k, 3.6*k); fillOut(P.orange, 1.6);
    ctx.fillStyle = P.white;
    ctx.fillRect(-8.5*k, 4*k, 3*k, 2*k); ctx.fillRect(5.5*k, 4*k, 3*k, 2*k);
    const wL = frame===0 ? 5*k : frame===1 ? 1*k : -3*k;
    const wR = frame===2 ? 5*k : frame===1 ? 1*k : -3*k;
    ctx.beginPath();
    ctx.moveTo(-6*k, -1*k); ctx.lineTo(-13*k, -8*k - wL);
    ctx.moveTo(6*k, -1*k);  ctx.lineTo(13*k, -8*k - wR);
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = P.ink; ctx.stroke();
    ell(0, -9.5*k, 6.2*k, 6.2*k); fillOut('#f5cba7', 2);
    ell(0, -14.5*k, 5.5*k, 2.4*k); fillOut(P.white, 1.5);
    ctx.fillStyle = P.teal; ctx.fillRect(-4.5*k, -13.5*k, 9*k, 1.6*k);
    ctx.fillStyle = P.ink;
    ctx.fillRect(-3.2*k, -10.5*k, 1.8*k, 2.2*k);
    ctx.fillRect(1.6*k, -10.5*k, 1.8*k, 2.2*k);
    ell(0, -6.8*k, 2*k, 1.5*k); ctx.fill();
    if(e.state==='walk'){
      rr(-13*k, -25*k, 26*k, 8*k, 3*k); fillOut(P.teal2, 1.5);
      text('HELP', 0, -21*k, 7, P.white, 'center', false);
    }

  } else if(e.type === 'grunt'){
    const lf = frame===0 ? 2.5*k : frame===2 ? -1.5*k : 0;
    const rf = frame===2 ? 2.5*k : frame===0 ? -1.5*k : 0;
    ell(-6*k, 9.5*k + lf, 4.5*k, 2.5*k); fillOut(c2, 1.6);
    ell(6*k, 9.5*k + rf, 4.5*k, 2.5*k); fillOut(c2, 1.6);
    for(const s of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(s*10*k, -3*k); ctx.lineTo(s*15.5*k, -6*k + stride*s*k);
      ctx.lineTo(s*14.5*k, -1*k); ctx.lineTo(s*16*k, 2*k); ctx.lineTo(s*10*k, 3*k);
      ctx.closePath(); fillOut(c2, 1.5);
    }
    ctx.beginPath();
    ctx.moveTo(-4*k, -9*k); ctx.lineTo(-3*k, -15*k); ctx.lineTo(0, -11*k);
    ctx.lineTo(0, -16.5*k); ctx.lineTo(3*k, -11*k); ctx.lineTo(4*k, -14.5*k); ctx.lineTo(4*k, -9*k);
    ctx.closePath(); fillOut(c1, 1.5);
    ell(0, 0, 12*k, 10.8*k); fillOut(c2, 2);
    ell(0, -2*k, 10.8*k, 8.5*k); ctx.fillStyle = c1; ctx.fill();
    ell(0, 3.5*k, 7*k, 4.5*k); ctx.fillStyle = 'rgba(243,227,184,0.35)'; ctx.fill();
    for(const s of [-1, 1]){
      ell(s*4.5*k, -3.5*k, 3.4*k, 3.8*k); fillOut(P.white, 1.3);
      ell(s*4.5*k + e.face, -2.2*k, 1.5*k, 2*k); ctx.fillStyle = P.ink; ctx.fill();
      ctx.beginPath(); ctx.moveTo(s*8*k, -8*k); ctx.lineTo(s*1.8*k, -5.8*k); ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.fillStyle = P.ink; ctx.fillRect(-4*k, 3.8*k, 8*k, 1.8*k);
    ctx.fillStyle = P.white;
    ctx.fillRect(-3.5*k, 2.2*k, 1.8*k, 2*k); ctx.fillRect(1.8*k, 2.2*k, 1.8*k, 2*k);

  } else if(e.type === 'runner'){
    const lean = e.face * 2.5 * k;
    if(!frz){
      ctx.fillStyle = P.cream;
      for(let i=0; i<3; i++){
        const syOff = ((G.time*65 + i*5) % 9);
        ctx.fillRect((-8 + i*8)*k, -14*k - syOff, 2, 5.5);
      }
    }
    const legA = frame===0 ? -4*k : frame===2 ? 4*k : 0;
    ctx.beginPath();
    ctx.moveTo(-3*k, 6*k); ctx.lineTo(-5*k + legA, 12.5*k);
    ctx.moveTo(3*k, 6*k);  ctx.lineTo(5*k - legA, 12.5*k);
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = P.ink; ctx.stroke();
    for(const s of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(s*5*k + lean, -5*k);
      ctx.lineTo(s*16*k + lean, -15*k + stride*s*1.5*k);
      ctx.lineTo(s*11*k + lean, -2*k);
      ctx.closePath(); fillOut(c1, 1.6);
    }
    ctx.beginPath();
    ctx.moveTo(lean, -11.5*k);
    ctx.lineTo(11.5*k + lean, -1.5*k);
    ctx.lineTo(lean, 10*k);
    ctx.lineTo(-11.5*k + lean, -1.5*k);
    ctx.closePath(); fillOut(c2, 2);
    ctx.beginPath();
    ctx.moveTo(lean, -10*k);
    ctx.lineTo(9.5*k + lean, -2*k);
    ctx.lineTo(lean, 7.5*k);
    ctx.lineTo(-9.5*k + lean, -2*k);
    ctx.closePath(); ctx.fillStyle = c1; ctx.fill();
    for(const s of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(s*1.5*k + lean, -2.5*k);
      ctx.lineTo(s*7.5*k + lean, -5.5*k);
      ctx.lineTo(s*6.5*k + lean, -0.5*k);
      ctx.closePath(); fillOut(P.white, 1.2);
      ctx.fillStyle = P.ink;
      ctx.fillRect(s*3.5*k + lean - 1, -3.5*k, 2, 2.5);
    }

  } else if(e.type === 'brute'){
    const b = 1.24;
    for(const s of [-1, 1]){
      const fistY = (s === -1 ? stride : -stride) * 2.8 * k;
      ctx.beginPath();
      ctx.moveTo(s*9*k*b, -8*k);
      ctx.lineTo(s*16*k*b, -6*k + fistY*0.3);
      ctx.lineTo(s*14*k*b, 2*k + fistY*0.3);
      ctx.lineTo(s*8*k*b, 1*k);
      ctx.closePath(); fillOut(c2, 1.8);
      rr(s*12.5*k*b - 3.5*k, 1*k + fistY, 7*k, 6.5*k, 2*k);
      fillOut(c1, 1.8);
      ctx.beginPath();
      ctx.moveTo(s*6*k*b, -9*k);
      ctx.lineTo(s*13.5*k*b, -18.5*k);
      ctx.lineTo(s*2.5*k*b, -11.5*k);
      ctx.closePath(); fillOut(P.cream, 1.6);
    }
    rr(-12*k*b, -10.5*k*b, 24*k*b, 21*k*b, 6*k); fillOut(c2, 2.2);
    rr(-10.8*k*b, -9.5*k*b, 21.6*k*b, 16*k*b, 5*k); ctx.fillStyle = c1; ctx.fill();
    rr(-8.5*k*b, 2.5*k, 17*k*b, 6.5*k, 2*k); fillOut('#5c3418', 1.6);
    for(const s of [-1, 1]){
      ctx.beginPath();
      ctx.moveTo(s*6.5*k, 4*k); ctx.lineTo(s*4.5*k, -1.5*k); ctx.lineTo(s*2.5*k, 4*k);
      ctx.closePath(); fillOut(P.cream, 1.3);
      ell(s*4.8*k*b, -4*k, 3.2*k, 3.4*k); fillOut(P.white, 1.3);
      ell(s*4.8*k*b + e.face, -3*k, 1.6*k, 1.8*k); ctx.fillStyle = P.ink; ctx.fill();
      ctx.beginPath(); ctx.moveTo(s*9*k*b, -8.5*k); ctx.lineTo(s*1.5*k, -5.5*k); ctx.lineWidth = 2.5; ctx.stroke();
    }

  } else if(e.type === 'splitter'){
    const sep = (e.hp === 1 ? 5.6 : 4.2) * k + Math.abs(stride) * 1.1 * k;
    for(const s of [-1, 1]){
      const lobeY = s * stride * 1.2 * k;
      ctx.beginPath(); ctx.moveTo(s*sep, -9*k + lobeY); ctx.lineTo(s*(sep+3*k), -14.5*k + lobeY);
      ctx.lineWidth = 2; ctx.strokeStyle = P.ink; ctx.stroke();
      ell(s*(sep+3*k), -15*k + lobeY, 2.2*k, 2.2*k); fillOut(P.pink, 1.2);
      ell(s*(sep+1*k), 9.5*k - lobeY, 4*k, 2.2*k); fillOut(c2, 1.5);
    }
    for(const s of [-1, 1]){
      const lobeY = s * stride * 1.0 * k;
      ell(s*sep, lobeY, 8.8*k, 10*k); fillOut(c2, 2);
      ell(s*sep, lobeY - 1.5*k, 7.6*k, 8*k); ctx.fillStyle = c1; ctx.fill();
    }
    const zig = (frame - 1) * 2.2 * k;
    ctx.beginPath();
    ctx.moveTo(0, -10.5*k);
    ctx.lineTo(-2.5*k + zig, -4*k);
    ctx.lineTo(2.5*k - zig, 2*k);
    ctx.lineTo(0, 9.5*k);
    ctx.lineWidth = e.hp === 1 ? 3.2 : 2.2;
    ctx.strokeStyle = P.ink; ctx.stroke();
    ctx.lineWidth = e.hp === 1 ? 1.8 : 1.1;
    ctx.strokeStyle = e.hp === 1 ? P.white : P.pink; ctx.stroke();

    for(const s of [-1, 1]){
      const lobeY = s * stride * 1.0 * k;
      const lx = s * sep;
      for(const es of [-1, 1]){
        ell(lx + es*2.4*k, lobeY - 2.5*k, 2.1*k, 2.5*k); fillOut(P.white, 1);
        ctx.fillStyle = P.ink;
        ctx.fillRect(lx + es*2.4*k - 0.8*k, lobeY - 2.2*k, 1.6*k, 1.8*k);
      }
      ctx.fillStyle = P.ink;
      ctx.fillRect(lx - 2.5*k, lobeY + 3.2*k, 5*k, 1.5*k);
    }
  }

  if(frz){
    ctx.fillStyle = 'rgba(168,230,255,0.28)';
    ctx.strokeStyle = P.white;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-S*0.34, -S*0.28); ctx.lineTo(0, -S*0.42); ctx.lineTo(S*0.34, -S*0.28);
    ctx.lineTo(S*0.30, S*0.32); ctx.lineTo(-S*0.30, S*0.32); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();

  if(e.state === 'gate'){
    const spW = S * 0.38;
    ctx.fillStyle = th.foam;
    ctx.beginPath();
    ctx.moveTo(-spW, S*0.18);
    for(let i=0; i<=6; i++){
      const px = -spW + (i/6)*(spW*2);
      const py = S*0.14 - (i%2 ? 4.5 : 1) - Math.sin(G.time*12 + i)*2;
      ctx.lineTo(px, py);
    }
    ctx.lineTo(spW, S*0.22);
    ctx.lineTo(-spW, S*0.22);
    ctx.closePath();
    fillOut(th.foam, 1.4);
  }

  ctx.restore();
  if(e.state !== 'walk') return;

  if(e.max > 1){
    const n = e.max, w = Math.min(6, (S - 6) / n);
    const x0 = x - n * w / 2, py = y - S * 0.48;
    ctx.fillStyle = P.ink;
    ctx.fillRect(x0 - 1, py - 1, n * w + 2, 5);
    for(let i=0; i<n; i++){
      ctx.fillStyle = i < e.hp ? (e.size===2 ? P.red : P.orange) : '#3a3a44';
      ctx.fillRect(x0 + i*w + 0.5, py, w - 1, 3);
    }
  }
  if(e.size === 2){
    const w = cellsOf(e)[e.weak], R = L.rect(w.c, w.r);
    reticle(R.x + R.w/2, R.y + R.h/2, 13, P.pink, true);
  } else if(e.r === 1 && e.type !== 'survivor'){
    reticle(x, y, 15, P.pink, false);
  }
}
function reticle(x,y,rad,col,filled){ ctx.save(); ctx.translate(x,y); ctx.rotate(G.time*2); if(filled){ ell(0,0,rad*0.5,rad*0.5); ctx.fillStyle=Math.floor(G.time*6)%2?P.pink:P.white; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle=P.ink; ctx.stroke(); }
  ctx.lineWidth=3; ctx.strokeStyle=P.ink; ctx.beginPath(); ctx.arc(0,0,rad,0,Math.PI*2); ctx.stroke(); ctx.lineWidth=2; ctx.strokeStyle=col; ctx.stroke();
  for(let i=0;i<4;i++){ ctx.rotate(Math.PI/2); ctx.fillStyle=P.ink; ctx.fillRect(rad-3,-2.5,8,5); ctx.fillStyle=col; ctx.fillRect(rad-2,-1.5,6,3); } ctx.restore(); }

function drawTelegraphs(){
  if($('aids').value==='low') return;

    if(e.state==='gate') continue;
    const p=e.t/e.step; if(p<0.55||e.r<=1||G.freezeT>0) continue;

      const cx=Q.x+Q.w/2, cy=Q.y+Q.h/2 + Math.sin(G.time*16)*1.5;
      ctx.beginPath(); ctx.moveTo(cx-6,cy-3); ctx.lineTo(cx+6,cy-3); ctx.lineTo(cx,cy+5); ctx.closePath();
      ctx.fill(); ctx.lineWidth=1; ctx.strokeStyle=P.ink; ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
}
function drawCellFx(){
  for(const f of G.cellFx){
    const R=L.rect(f.c,f.r), a=clamp(f.t/f.t0,0,1), cx=R.x+R.w/2, cy=R.y+R.h/2;
    if(f.kind==='bomb'){
      // 3x3 Bomb Blast tile: magma glow + rising flame ring
      ctx.save();
      ctx.globalAlpha = a * 0.9;
      ctx.fillStyle = a > 0.6 ? P.yellow : P.orange;
      rr(R.x+2, R.y+2, R.w-4, R.h-4, 5); ctx.fill();
      ctx.strokeStyle = P.white; ctx.lineWidth = 2;
      ell(cx, cy, (R.w*0.42)*(1.1-a*0.5), (R.h*0.42)*(1.1-a*0.5)); ctx.stroke();
      ctx.restore();
    } else if(f.kind==='miss'){
      // Miss Ripple: concentric expanding sand/shock ring + crisp X mark
      ctx.save();
      const prog = 1 - a;
      ctx.globalAlpha = a * 0.9;
      ctx.strokeStyle = P.red;
      ctx.lineWidth = 2;
      ell(cx, cy, 4 + prog * (R.w * 0.44), 3 + prog * (R.h * 0.38));
      ctx.stroke();
      const s = 6 * (0.7 + 0.3 * Math.sin(prog * Math.PI));
      ctx.strokeStyle = P.ink; ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(cx-s,cy-s); ctx.lineTo(cx+s,cy+s); ctx.moveTo(cx+s,cy-s); ctx.lineTo(cx-s,cy+s); ctx.stroke();
      ctx.strokeStyle = P.red; ctx.lineWidth = 1.8; ctx.stroke();
      ctx.restore();
    } else {
      ctx.globalAlpha = a * 0.82;
      ctx.fillStyle = f.kind==='hit' ? '#7fd6ff' : P.grey;
      rr(R.x+3, R.y+3, R.w-6, R.h-6, 5); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}
function drawDecals(){
  for(const d of G.decals){
    ctx.globalAlpha=Math.min(1,d.t/2)*0.55; ctx.fillStyle=d.col;
    ctx.beginPath();
    for(let i=0;i<12;i++){ const a=i/12*Math.PI*2, rad=(9+((Math.sin(d.seed+i*2.3)+1)*4))*d.s; ctx.lineTo(d.x+Math.cos(a)*rad,d.y+Math.sin(a)*rad*0.6+6); }
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawFx(){
  // High-energy turret tracer bolt + impact starburst
  for(const t of G.tracers){
    const a = clamp(t.t / (t.t0 || 0.09), 0, 1);
    ctx.save();
    ctx.strokeStyle = P.ink; ctx.lineWidth = 5.5 * a;
    ctx.beginPath(); ctx.moveTo(L.turret.x, L.turret.y); ctx.lineTo(t.x, t.y); ctx.stroke();
    ctx.strokeStyle = G.armed ? P.orange : P.yellow; ctx.lineWidth = 3 * a; ctx.stroke();
    ctx.strokeStyle = P.white; ctx.lineWidth = 1.2 * a; ctx.stroke();
    // Starburst impact flare at target cell
    ctx.translate(t.x, t.y);
    ctx.fillStyle = P.white;
    for(let i=0; i<4; i++){
      ctx.rotate(Math.PI / 4);
      ctx.fillRect(-8*a, -1.5*a, 16*a, 3*a);
    }
    ctx.restore();
  }
  // Shockwave rings (bomb & boss kill & freeze)
  for(const r of G.rings){
    const a = 1 - r.t / r.t0, rad = lerp(r.r0, r.r1, a);
    ctx.save();
    ctx.globalAlpha = 1 - a;
    ctx.lineWidth = 6 * (1 - a * 0.4); ctx.strokeStyle = P.ink;
    ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI*2); ctx.stroke();
    ctx.lineWidth = 3 * (1 - a * 0.3); ctx.strokeStyle = r.col; ctx.stroke();
    ctx.restore();
  }
  // Pixel debris + directional velocity sparks
  for(const p of G.parts){
    if(p.spark){
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.fillStyle = P.ink; ctx.fillRect(-4, -1.5, 8, 3);
      ctx.fillStyle = p.col; ctx.fillRect(-3.5, -1, 7, 2);
      ctx.restore();
    } else {
      ctx.fillStyle = P.ink; ctx.fillRect(p.x-1, p.y-1, p.s+2, p.s+2);
      ctx.fillStyle = p.col; ctx.fillRect(p.x, p.y, p.s, p.s);
    }
  }
  // Pop-in floating score numbers & callouts
  for(const f of G.floaters){
    const prog = 1 - f.t / (f.t0 || 0.9);
    const sc = prog < 0.16 ? lerp(0.5, 1.32, prog / 0.16) : prog < 0.30 ? lerp(1.32, 1.0, (prog - 0.16) / 0.14) : 1.0;
    ctx.save();
    ctx.globalAlpha = Math.min(1, f.t * 3.2);
    ctx.translate(f.x, f.y);
    ctx.scale(sc, sc);
    text(f.txt, 0, 0, f.size, f.col, 'center');
    ctx.restore();
  }
}

// Procedural 6-branch hexagonal ice crystal for Freeze overlay
function drawIceCrystal(x, y, rad, rot, alpha){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = P.white;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  for(let i=0; i<6; i++){
    const a = i * Math.PI / 3;
    const ca = Math.cos(a), sa = Math.sin(a);
    ctx.moveTo(0, 0); ctx.lineTo(ca * rad, sa * rad);
    const b1 = rad * 0.58, bLen = rad * 0.32;
    ctx.moveTo(ca * b1, sa * b1);
    ctx.lineTo(ca * b1 + Math.cos(a + 0.55) * bLen, sa * b1 + Math.sin(a + 0.55) * bLen);
    ctx.moveTo(ca * b1, sa * b1);
    ctx.lineTo(ca * b1 + Math.cos(a - 0.55) * bLen, sa * b1 + Math.sin(a - 0.55) * bLen);
  }
  ctx.stroke();
  ctx.restore();
}
function drawFreezeOverlay(){
  const a = clamp(G.freezeT / 1.2, 0, 1);
  // Frosty border frame & subtle screen tint
  ctx.fillStyle = `rgba(130,215,255,${0.14 * a})`;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = `rgba(190,240,255,${0.55 * a})`;
  ctx.lineWidth = 8;
  ctx.strokeRect(4, 4, W - 8, H - 8);
  // Corner & arena-edge branching ice crystals
  const crystals = [[28,28,18],[W-28,28,18],[28,H-28,18],[W-28,H-28,18],[L.arena.x+8,L.arena.y+12,12],[L.arena.x+L.arena.w-8,L.arena.y+12,12]];
  for(let i=0; i<crystals.length; i++){
    const [cx, cy, cr] = crystals[i];
    drawIceCrystal(cx, cy, cr * (0.85 + 0.15*Math.sin(G.time*3+i)), G.time*0.3 + i, 0.78 * a);

}

function bar(x, y, w, h, frac, col, trailFrac, spark){
  const f = clamp(frac, 0, 1);
  const fw = Math.round(w * f);
  ctx.fillStyle = P.ink;
  ctx.fillRect(x - 1.5, y - 1.5, w + 3, h + 3);
  ctx.fillStyle = '#252019';
  ctx.fillRect(x, y, w, h);
  // Damage trail (white/crimson lag bar when HP drops)
  if(trailFrac !== undefined && trailFrac > f){
    const tw = Math.round(w * clamp(trailFrac, 0, 1));
    ctx.fillStyle = '#ff6b57';
    ctx.fillRect(x + fw, y, Math.max(0, tw - fw), h);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(x + fw, y, Math.max(0, tw - fw), Math.max(1, h * 0.4));
  }
  if(fw > 0){
    ctx.fillStyle = col;
    ctx.fillRect(x, y, fw, h);
    // Specular highlight strip along top of bar
    ctx.fillStyle = 'rgba(255,255,255,0.34)';
    ctx.fillRect(x, y, fw, Math.max(1, Math.floor(h * 0.35)));
  }
  // Subtle segment tick marks on wide bars
  if(w >= 80 && h >= 6){
    ctx.fillStyle = 'rgba(20,20,20,0.38)';
    for(let i=1; i<4; i++) ctx.fillRect(Math.round(x + (w*i)/4), y, 1, h);
  }
  // Animated burning fuse spark on combo meter
  if(spark && f > 0.02){
    const sx = x + fw, sy = y + h * 0.5;
    const pulse = 2.2 + Math.sin(G.time * 24) * 1.1;
    ctx.fillStyle = P.white;
    ctx.fillRect(sx - 1.5, sy - pulse, 3, pulse * 2);
    ctx.fillStyle = P.yellow;
    ctx.fillRect(sx - 2.5, sy - 1.5, 5, 3);
  }
}

// Additive lighting pass for LEDs, weak-point core, laser tracers, and explosions (High quality)
const bloomCv = document.createElement('canvas');
bloomCv.width = 160; bloomCv.height = 90;
const bloomCtx = bloomCv.getContext('2d');
bloomCtx.imageSmoothingEnabled = true;

function drawAdditiveGlow(){
  if($('qual').value === 'low') return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // 1. Occupied LED pad glow & Crab King weak-point core glow
  for(const e of G.enemies){
    if(e.state !== 'walk') continue;
    const cells = cellsOf(e);
    for(let i=0; i<cells.length; i++){
      const k = cells[i], R = L.rect(k.c, k.r);
      const cx = R.x + R.w*0.5, cy = R.y + R.h*0.5;
      if(e.size === 2 && i !== e.weak) continue;
      ctx.globalAlpha = e.size === 2 ? 0.24 : 0.14;
      ctx.fillStyle = G.freezeT > 0 ? P.ice : (e.size === 2 ? P.pink : e.d.c1);
      ell(cx, cy, R.w * 0.56, R.h * 0.52);
      ctx.fill();
    }
  }
  // 2. Turret muzzle & tracer additive bloom
  if(G.muzzleT > 0){
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = P.orange;
    ell(L.turret.x + Math.cos(G.turretAng)*18, L.turret.y + Math.sin(G.turretAng)*18, 18, 18);
    ctx.fill();
  }
  for(const t of G.tracers){
    const a = clamp(t.t / (t.t0 || 0.09), 0, 1);
    ctx.globalAlpha = 0.26 * a;
    ctx.strokeStyle = G.armed ? P.orange : P.yellow;
    ctx.lineWidth = 9 * a;
    ctx.beginPath(); ctx.moveTo(L.turret.x, L.turret.y); ctx.lineTo(t.x, t.y); ctx.stroke();
    ctx.fillStyle = P.yellow;
    ell(t.x, t.y, 14 * a, 14 * a); ctx.fill();
  }
  // 3. Bomb shockwave & blast cell additive glow
  for(const f of G.cellFx){
    if(f.kind !== 'bomb' && f.kind !== 'hit') continue;
    const R = L.rect(f.c, f.r), a = clamp(f.t / f.t0, 0, 1);
    ctx.globalAlpha = (f.kind === 'bomb' ? 0.25 : 0.16) * a;
    ctx.fillStyle = f.kind === 'bomb' ? P.orange : P.ice;
    ell(R.x + R.w*0.5, R.y + R.h*0.5, R.w*0.6, R.h*0.6); ctx.fill();
  }
  // 4. Subtle hardware bloom pass via 160x90 downsample
  bloomCtx.clearRect(0, 0, 160, 90);
  bloomCtx.drawImage(cv, 0, 0, 160, 90);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.16;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(bloomCv, 0, 0, W, H);
  ctx.imageSmoothingEnabled = false;
  ctx.restore();
}

function drawWaveBanner(){
  if(!G.banner) return;
  const b = G.banner, t0 = b.t0 || 2.4;
  const elapsed = t0 - b.t;
  const enter = clamp(elapsed / 0.22, 0, 1);
  const exit = clamp(b.t / 0.24, 0, 1);
  const a = Math.min(enter, exit);
  // Slide in from left, slide out to right
  const slideX = enter < 1 ? (1 - enter) * (1 - enter) * -W * 0.65 : exit < 1 ? (1 - exit) * (1 - exit) * W * 0.65 : 0;
  const isBoss = G.wave % 3 === 0 && G.mode === 'play';
  const barCol = isBoss ? P.red : P.teal;

  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(slideX, 0);
  ctx.fillStyle = 'rgba(14,16,24,0.92)';
  ctx.fillRect(-W, 136, W * 3, 62);
  ctx.fillStyle = barCol;
  ctx.fillRect(-W, 136, W * 3, 5);
  ctx.fillRect(-W, 193, W * 3, 5);
  // Diagonal hazard stripes along the top & bottom borders

  ctx.restore();
}

// ───────────────────────────── Precomputed LUT Bayer Bit-Crush ─────────────────────────────
const crushSel=$('crush'); const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const CRUSH_LUTS = {};
for(const bits of [3, 4, 5]){
  const lut = new Uint8Array(16 * 256);
  const levels = (1 << bits) - 1;
  const step = 255 / levels;
  for(let b=0; b<16; b++){
    const th = (BAYER[b] / 16 - 0.5) * step;
    for(let v=0; v<256; v++){
      lut[(b << 8) | v] = clamp(Math.round((v + th) / step) * step, 0, 255);
    }
  }
  CRUSH_LUTS[bits] = lut;
}
function postProcess(){
  if($('qual').value === 'low') return;
  const bits = parseInt(crushSel.value, 10);
  if(!bits) return;
  const lut = CRUSH_LUTS[bits];
  if(!lut) return;
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  for(let y=0; y<H; y++){
    const by = (y & 3) * 4;
    let i = y * W * 4;
    for(let x=0; x<W; x++, i+=4){
      const bShift = (by + (x & 3)) << 8;
      d[i]   = lut[bShift | d[i]];
      d[i+1] = lut[bShift | d[i+1]];
      d[i+2] = lut[bShift | d[i+2]];
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ───────────────────────────── Launchpad lights (the light painter) ─────────────────────────────
const key=(c,r)=>r*10+c;
const scale=(rgb,k)=>rgb.map(v=>clamp(Math.round(v*k),0,63));
const mix=(a,b,k)=>a.map((v,i)=>clamp(Math.round(v+(b[i]-v)*k),0,63));
function lpCell(c,r){ return L.kind==='pad'?{c,r}:(c<=8?{c,r:r+4}:null); }
function buildLeds(){
  const m=new Map(); const set=(c,r,rgb)=>{ if(r===9){ if(c>=1&&c<=8) m.set(103+c,rgb); } else m.set(key(c,r),rgb); };
  for(let r=1;r<=9;r++) for(let c=1;c<=9;c++){ if(r===9&&c===9) continue; set(c,r,[0,0,0]); }
  const t=G.time;
  if(G.mode==='title'){
    for(let c=1;c<=8;c++){ const r=8-Math.floor((t*3+c*1.7)%10); if(r>=1&&r<=8) set(c,r,c%3===0?T.runner.lp:T.grunt.lp); if(r+1<=8&&r+1>=1) set(c,r+1,scale(T.grunt.lp,0.2)); }
    for(let c=1;c<=8;c++) set(c,9,(Math.floor(t*4)+c)%8===0?[63,40,0]:[0,6,8]);
    for(let r=1;r<=8;r++) set(9,r,Math.floor(t*2)%2?[0,20,24]:[0,8,10]); return m; }
  if(G.mode==='over'){ const k=0.3+0.3*Math.sin(t*3); for(let r=1;r<=8;r++) for(let c=1;c<=9;c++) set(c,r,scale([63,0,0],k*(r<=2?1:0.4))); return m; }
  const hc=G.hp>50?[0,63,10]:G.hp>25?[63,50,0]:[63,0,0];
  if(L.kind==='keys') for(let c=1;c<=8;c++) set(c,4,scale(hc,0.25));
  for(let c=1;c<=8;c++){ let v=(G.waveTotal&&c<=Math.round(8*G.waveDone/G.waveTotal))?[0,14,18]:[0,0,0]; if(beatMode&&G.beatFlash>0) v=mix(v,(G.beatN-1)%4===0?[63,20,40]:[40,40,10],G.beatFlash*0.8); set(c,9,v); }
  const frz=G.freezeT>0;
  for(const e of G.enemies){
    if(e.state==='gate'){ const on=Math.floor(t*10)%2===0; for(let d=0;d<e.size;d++){ if(e.c+d<=8) set(e.c+d,9,on?e.d.lp:scale(e.d.lp,0.15)); if(L.kind==='pad'||e.c+d<=8){ const p=lpCell(e.c+d,L.rows); if(p) set(p.c,p.r,scale(e.d.lp,0.12)); } } continue; }
    const prog=e.t/e.step; if(!frz&&prog>0.55&&e.r>1&&$('aids').value!=='low') for(let d=0;d<e.size;d++){ const p=lpCell(e.c+d,e.r-1); if(p&&!enemyAt(e.c+d,e.r-1)) set(p.c,p.r,scale(e.d.lp,0.08+0.25*(prog-0.55))); }
    const near=1-(e.r-1)/Math.max(1,L.rows-1);
    for(const k of cellsOf(e)){ const p=lpCell(k.c,k.r); if(!p) continue; let rgb;
      if(frz) rgb=[20,50,63];
      else if(e.type==='survivor') rgb=[40,63,63];
      else if(e.size===2){ const w=cellsOf(e)[e.weak]; rgb=(w.c===k.c&&w.r===k.r)?(Math.floor(t*8)%2?[63,20,40]:[63,63,63]):[30,0,0]; }
      else { const speed=2+near*10; const pulse=near>0.6?(0.65+0.35*Math.sin(t*speed*Math.PI)):1; rgb=scale(e.d.lp,(0.45+0.55*near)*pulse); if(e.r===1&&Math.floor(t*8)%2) rgb=mix(rgb,[63,63,63],0.5); }
      if(e.hitT>0) rgb=[63,63,63];
      set(p.c,p.r,rgb); } }
  for(const f of G.cellFx){ const p=lpCell(f.c,f.r); if(!p) continue; const a=f.t/f.t0; const col=f.kind==='hit'?[30,50,63]:f.kind==='bomb'?[63,24,0]:f.kind==='armour'?[30,30,30]:[63,0,0]; if(!enemyAt(f.c,f.r)||f.kind==='bomb') set(p.c,p.r,scale(col,a)); }
  set(9,8,G.armed?(Math.floor(t*8)%2?[63,30,0]:[63,63,0]):G.bombs>0?[50,14,0]:[3,1,0]);
  set(9,7,frz?[30,60,63]:G.charge>=100?(Math.floor(t*3)%2?[20,50,63]:[6,20,30]):scale([6,20,30],G.charge/100));
  for(let i=1;i<=6;i++) set(9,i,G.hp/100*6>=i-0.5?(G.hurtT>0?[63,0,0]:hc):[0,0,0]);
  if(G.hurtT>0&&L.kind==='pad') for(let c=1;c<=8;c++) if(!enemyAt(c,1)) set(c,1,scale([63,0,0],G.hurtT*2));
  if(G.mode==='inter'){ const sweep=Math.floor(G.modeT*12)%9; for(let r=1;r<=8;r++) set(sweep||1,r,[0,40,50]); }
  return m;
}
const mctx=$('mirror').getContext('2d');
function drawMirror(frame){ mctx.fillStyle='#000'; mctx.fillRect(0,0,40,40); for(let r=1;r<=9;r++) for(let c=1;c<=9;c++){ if(r===9&&c===9) continue; const v=r===9?frame.get(103+c):frame.get(key(c,r)); if(!v) continue;
  mctx.fillStyle=`rgb(${v[0]*4},${v[1]*4},${v[2]*4})`; const x=(c-1)*4+(c===9?3:0)+1, y=(9-r)*4+(r<9?3:0)+1; if(c===9||r===9){ mctx.beginPath(); mctx.arc(x+1.5,y+1.5,1.5,0,7); mctx.fill(); } else mctx.fillRect(x,y,3,3); } }

// ───────────────────────────── Web MIDI (Launchpad MK2) ─────────────────────────────
const LP={access:null,input:null,output:null,last:new Map()};
const lamp=$('lamp'), midiTxt=$('midiTxt');
function midiStatus(cls,txt){ lamp.className='lamp '+cls; midiTxt.textContent=txt; }
function connectMidi(){ if(!navigator.requestMIDIAccess){ midiStatus('','MIDI: not supported here (use Edge/Chrome)'); return; } navigator.requestMIDIAccess({sysex:true}).then(acc=>{ LP.access=acc; scanMidi(); acc.onstatechange=scanMidi; },err=>midiStatus('warn','MIDI: permission refused ('+err.name+')')); }
function scanMidi(){ const acc=LP.access; if(!acc) return; let inp=null,out=null; for(const i of acc.inputs.values()) if(/launchpad mk2/i.test(i.name)) inp=i; for(const o of acc.outputs.values()) if(/launchpad mk2/i.test(o.name)) out=o;
  if(LP.input&&LP.input!==inp) LP.input.onmidimessage=null; LP.input=inp; LP.output=out; if(inp) inp.onmidimessage=onMidi;
  if(out){ try{ out.send([0xF0,0x00,0x20,0x29,0x02,0x18,0x22,0x00,0xF7]); LP.last.clear(); }catch(e){ midiStatus('warn','MIDI: output busy ('+e.message+')'); return; } }
  if(inp&&out) midiStatus('on','MIDI: '+inp.name); else if(inp||out) midiStatus('warn','MIDI: Launchpad half-open (close other MIDI apps)'); else midiStatus('','MIDI: no Launchpad MK2 (mouse + keys work)'); }
function onMidi(e){ const [st,d1,d2]=e.data; const type=st&0xF0;
  if(type===0x90||type===0x80){ const on=type===0x90&&d2>0; const c=d1%10, r=Math.floor(d1/10); if(c>=1&&c<=9&&r>=1&&r<=8) on?padDown(c,r):padUp(c,r); }
  else if(type===0xB0){ const c=d1-103; if(c>=1&&c<=8){ d2>0 ? padDown(c,9) : padUp(c,9); } } }
function sendLeds(frame){ if(!LP.output) return; const ch=[]; for(const [note,rgb] of frame){ const p=LP.last.get(note); if(!p||p[0]!==rgb[0]||p[1]!==rgb[1]||p[2]!==rgb[2]){ ch.push(note,rgb[0],rgb[1],rgb[2]); LP.last.set(note,rgb); } }
  for(let i=0;i<ch.length;i+=160){ try{ LP.output.send([0xF0,0x00,0x20,0x29,0x02,0x18,0x0B,...ch.slice(i,i+160),0xF7]); }catch(e){} } }

      default: $('layout').value || 'pad',
      options: [
        { value: 'pad', label: 'Launchpad 8×8 Matrix' },
        { value: 'keys', label: 'Physical Keyboard 10×4 Arena' }
      ]
    },
    {
      id: 'mode',
      label: 'Tempo / Timing Engine',
      type: 'select',
      default: $('mode').value || 'free',
      options: [
        { value: 'free', label: 'Free (Continuous Real-Time Movement)' },
        { value: 'beat', label: 'Beat (Drum Beat Step Sync + On-Beat Multipliers)' }
      ]
    },
    {
      id: 'diff',
      label: 'March Speed & Wave Difficulty',
      type: 'select',
      default: $('diff').value || '1',
      options: [
        { value: '0.8', label: 'Easy (0.8x Pace)' },
        { value: '1', label: 'Normal (1.0x Pace)' },
        { value: '1.25', label: 'Hard (1.25x Rapid Waves)' }
      ]
    },
    {
      id: 'aids',
      label: 'Visual Targeting Aids',
      type: 'select',
      default: $('aids').value || 'medium',
      options: [
        { value: 'full', label: 'Full Aids (Key Labels + Advance Step Glow)' },
        { value: 'medium', label: 'Medium (Next Step Highlight)' },
        { value: 'low', label: 'Low (Hardcore Unassisted)' }
      ]
    },
    {
      id: 'crt',
      label: 'CRT Display Filter',
      type: 'select',
      default: $('crt').value || 'curved',
      options: [
        { value: 'curved', label: 'Curved Cathode Ray Tube' },
        { value: 'on', label: 'Flat CRT Scanlines' },
        { value: 'off', label: 'Off (Clean Pixel Graphics)' }
      ]
    },
    {
      id: 'snd',
      label: 'Audio Profile',
      type: 'select',
      default: $('snd').value || 'sfx',
      options: [
        { value: 'sfx', label: 'SFX Audio (Impacts, Voices & Drums)' },
        { value: 'synth', label: 'Arcade Synth Beeps' },
        { value: 'off', label: 'Mute Audio' }
      ]
    }
  ],
  keybindings: [
    { key: 'Pad / Key', desc: 'Shoot incoming monster at target column & row' },
    { key: 'Side ▶ 8 / Shift+Key', desc: 'Arm 3×3 High-Explosive Beach Bomb' },
    { key: 'Side ▶ 7 / Space', desc: 'Trigger Cryogenic Freeze wave (charges on kills)' },
    { key: 'P / `', desc: 'Pause / Resume defense wave' },
    { key: 'Esc / M', desc: 'Open Defense Console & Hardware Setup' }
  ],
  onStart: (settings, mode) => {
    $('layout').value = settings.layout;
    L = makeLayout(settings.layout);
    sandDirty = true;
    setHelp();

    $('mode').value = settings.mode;
    beatMode = settings.mode === 'beat';

    $('diff').value = settings.diff;
    diff = parseFloat(settings.diff);

    $('aids').value = settings.aids;
    $('crt').value = settings.crt;
    $('wrap').classList.toggle('nocrt', settings.crt === 'off');
    $('wrap').classList.toggle('curved', settings.crt === 'curved');

    $('snd').value = settings.snd;
    Snd.setMode(settings.snd);

    startGame();
  },
  onResume: () => {
    if (G.paused) togglePause();
  },
  onPause: () => {
    if (!G.paused && G.mode === 'play') togglePause();
  },
  onRestart: (settings) => {
    $('layout').value = settings.layout;
    L = makeLayout(settings.layout);
    sandDirty = true;
    setHelp();
    beatMode = settings.mode === 'beat';
    diff = parseFloat(settings.diff);
    startGame();
  },
  onParameterChange: (key, val) => {
    const el = $(key);
    if (el) {
      el.value = val;
      el.dispatchEvent(new Event('change'));
    }
  }
});

const openHordeMenuBtn = document.getElementById('openMenuBtn');
if (openHordeMenuBtn) openHordeMenuBtn.onclick = () => window.gameMenu.open();
</script>
</body>
</html>
