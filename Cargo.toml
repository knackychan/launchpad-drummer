[workspace]
resolver = "2"
members = ["crates/lpd-core", "src-tauri", "tools/lp-probe"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"
cpal = "0.15"
rtrb = "0.3"
symphonia = { version = "0.5", features = ["mp3"] }
hound = "3.5"
tempfile = "3"
assert_no_alloc = "1.1"
