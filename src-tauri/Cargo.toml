[package]
name = "launchpad-drummer"
version = "0.1.0"
description = "Launchpad Drummer console"
edition = "2021"

[features]
asio = ["cpal/asio"]

[lib]
name = "launchpad_drummer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lpd-core = { path = "../crates/lpd-core" }
tauri = { version = "2", features = [] }
midir = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
cpal = { workspace = true }
rtrb = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
hound = { workspace = true }
tempfile = { workspace = true }
